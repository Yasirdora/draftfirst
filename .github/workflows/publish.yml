name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify or publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the audited npm release toolchain
        run: npm install --global npm@11.16.0
      - run: npm --version
      - run: npm ci
      - run: npm run quality
      - name: Ensure release tag matches package version
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"
      - name: Check npm release state
        id: npm_release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          set +e
          lookup="$(npm view "@draftfirst/core@${version}" version 2>&1)"
          status=$?
          set -e

          if [[ $status -eq 0 ]]; then
            if [[ "$lookup" != "$version" ]]; then
              echo "Expected npm version ${version}, received ${lookup}." >&2
              exit 1
            fi

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@draftfirst/core@${version} is already published; publication will be skipped."
          elif [[ "$lookup" == *"E404"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "@draftfirst/core@${version} is not published yet."
          else
            echo "$lookup" >&2
            exit "$status"
          fi
      - name: Publish through npm trusted publishing
        if: steps.npm_release.outputs.exists == 'false'
        run: npm publish --workspace=@draftfirst/core --access public
      - name: Verify published npm version
        env:
          PACKAGE_VERSION: ${{ steps.npm_release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@draftfirst/core@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            if [[ "$published" == "$PACKAGE_VERSION" ]]; then
              echo "Verified @draftfirst/core@${PACKAGE_VERSION} on npm."
              exit 0
            fi

            if [[ $attempt -lt 5 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Expected npm version ${PACKAGE_VERSION}, received ${published:-no response}." >&2
          exit 1
