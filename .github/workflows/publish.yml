name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the audited npm release toolchain
        run: npm install --global npm@11.16.0
      - run: npm --version
      - run: npm ci
      - run: npm run quality
      - name: Ensure release tag matches package version
        run: node scripts/verify-release-tag.mjs "${{ github.event.release.tag_name }}"
      - name: Publish through npm trusted publishing
        run: npm publish --workspace=@draftfirst/core --access public
