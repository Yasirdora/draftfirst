name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality

  package-runtime:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run package:verify
      - run: npm run package:smoke

  swift-packages:
    name: Swift packages / macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The engine is pinned to the TypeScript conformance corpus; the core and
      # the shared panels are what the Mac app will be built from. Running them
      # here is what stops the two apps from drifting: a rule that behaves
      # differently on the desktop fails in CI rather than in a writer's hands.
      - name: Engine
        run: swift test --package-path apple/eDraftEngine
      - name: Core
        run: swift test --package-path apple/EDraftCore
      - name: Shared panels
        run: swift test --package-path apple/EDraftUI
      - name: Mac surface
        run: swift test --package-path apple/EDraftMacSurface
