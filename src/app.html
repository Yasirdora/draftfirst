<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Resolve the UI theme before the stylesheet loads so dark chrome never
			// flashes light. Modes: light | dark | system (default — follows the OS).
			(function () {
				var mode = 'system';
				try {
					var raw = localStorage.getItem('writing-desk:theme:v1');
					if (raw) {
						var saved = JSON.parse(raw);
						if (
							saved &&
							(saved.mode === 'light' || saved.mode === 'dark' || saved.mode === 'system')
						) {
							mode = saved.mode;
						}
					}
				} catch (error) {
					/* private mode / corrupt value — fall back to system */
				}
				var dark =
					mode === 'dark' ||
					(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
