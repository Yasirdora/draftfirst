utterance: "The Omit story, finished — and the scene's hover actions, born. A writer cannot omit a scene. The Navigator's scene rows get hover actions: Omit Scene on a live scene, Restore Scene on an omitted one (trailing edge, secondary color, SF Symbols), architected so Lock Scene and Scene Status slot in later — no greyed placeholders. Parity is mandatory: the same two commands as a right-click context menu on the scene heading in the text, and a menu bar item (Production menu if it exists; otherwise Format) that enables/disables with the caret's position. Done means: Omit with the caret anywhere in a scene collapses it to the card as real model state (Omission over the scene's elements); Restore is the reverse from the Navigator row, the card's context menu, or the menu bar; ⌘Z reverses omit/restore named \"Undo Omit Scene\"; page numbers and count exclude the cut body; FDX round-trips through the engine splice; Fountain documents either disable the command with a clear reason or warn; VoiceOver announces the action and result; no regression to the chevron, fade, caret anchoring, Navigator strike, both layouts, light and dark. Proof: EDraftCore and EDraftMacSurface suites green with new failing-before tests, macOS Debug build succeeds, measured before/after on a real FDX (omit → save → reopen; restore → save → reopen). Budget: EditorState/Omissions (EDraftCore), StoryPanel (EDraftUI), ScriptMenus/MainMenu, ScriptSurface or its context-menu path, tests in both packages. Deny the xcscheme, mcp.log, the root PNGs and the in-progress src/ help files. No commit until I say so."
goal: A writer can omit and restore a scene from the Navigator row's hover action, the text's right-click menu, and the Format menu; the omission is model state, undoable as "Omit Scene"/"Restore Scene", excluded from page math, spoken to VoiceOver, and survives FDX save → reopen in both directions; the command is disabled with a stated reason where the file format cannot keep it.
interpretation: |
  WHAT AN OMIT IS, IN THIS MODEL. Final Draft nests the cut scene inside a
  new Scene Heading whose text is OMITTED and whose number is the scene's
  (IL-0071 reads exactly that shape). So Omit inserts one element — the
  OMITTED card, carrying the heading's scene number — directly before the
  scene's heading, and records an OmittedScene whose body is the heading
  through the last element before the next heading (asides excluded).
  Restore removes the card and the record; every body element keeps its
  DraftElementID and text, so the script is byte-identical to before.
  The body stays collapsed on omit (the IL-0076 display path), the caret
  moves to the card, and the viewport does not jump.

  ONE MUTATION, THREE DOORS. EditorState gains omitScene/restoreScene
  (plus canOmit/canRestore queries by element) and an OmittedScenes
  mutation API in Omissions.swift. The surface owns undo (editingUndo);
  ModelUndoState grows the omission set so one registerModelUndo reverses
  elements AND omissions together, named "Omit Scene" / "Restore Scene".
  The Navigator row, the text's right-click menu, the OMITTED card's
  right-click menu, and Format ▸ Omit Scene all call the same surface
  entry point. The Format item is one item that retitles (Omit Scene ↔
  Restore Scene) by the caret's scene, disabled with no scene.

  THE NAVIGATOR ROW. StoryList's Mac scene row gains a trailing hover
  action slot, driven by a small SceneRowAction value list (today: omit
  or restore; later: lock, status) so new actions slot in without
  redesign. Hidden until hover, SF Symbol, secondary ink, no placeholders.
  The source list's selection highlight must survive the button.

  PERSISTENCE — THE ENGINE WORK THE BRIEF DID NOT BUDGET. Measured in the
  code: Fdx.Document.rewrite (both ports) finds omitted bodies by the
  ORIGIN's structure and ignores script.omissions ("Matched against the
  file rather than against script.omissions, because Fountain has no
  spelling for an omission"). So today an app omit would save as a live
  "OMITTED" heading plus the live scene, and an app restore would be
  silently re-omitted on save. The rewrite must take the save's omission
  spans explicitly: write a new <OmittedScene> block inside the card
  paragraph (nested paragraphs keep their original bytes when unedited),
  and on restore unwrap the block back to top-level paragraphs, keeping
  their bytes and tags. ScreenplayFile.encode gains an omissions input
  and ScreenplayDocument passes the editor's spans (index spans over the
  merged document the Fountain source parses to, after flushPendingWork).
  Ported to TypeScript for parity, with a cross-port case in fdx.json.

  FOUNTAIN (.fountain and .edraft, which is Fountain on disk): the command
  is DISABLED, the menu item's tooltip and the row action's help say
  "Omissions are kept in Final Draft (.fdx) files", and VoiceOver hears
  the same. Chosen over a save-time warning because a warning lets the
  writer do something the file will silently undo on reopen — a cut that
  comes back uninvited is worse than a cut that was never offered.

  RFC §7.3 says "Omit is Blocked in development". The app has no
  development/production state. This lock amends §7.3 to record that
  Omit/Restore ship for FDX documents, and updates the MACOS-EXECUTION
  "Not done here" note.

  VOICEOVER: on omit/restore the surface posts an announcement —
  "Scene 21 omitted, 0.3 pages cut" / "Scene 21 restored" — built from
  OmittedScene.spoken's strings.
