accept:
  - "OMIT: with the caret anywhere from a scene's heading to its last element, Omit Scene inserts the OMITTED card (carrying the scene number) and records the scene as omitted; the body collapses to the card through the IL-0076 path. Test fails against HEAD (no such command)."
  - "RESTORE: Restore Scene from the row, the card's context menu, or Format returns the element list byte-identical to before the omit — same text, types, runs, DraftElementIDs."
  - "UNDO: ⌘Z after omit restores the live scene, after restore re-omits it; the Edit menu reads Undo Omit Scene / Undo Restore Scene; redo re-applies."
  - "ENABLEMENT: Format ▸ Omit Scene is enabled in a live scene, retitles to Restore Scene on a card, is disabled above the first heading and in a Fountain/.edraft document (with the stated reason)."
  - "PAGES: page numbers and page count exclude an omitted body, collapsed and expanded."
  - "PERSISTENCE: engine tests — rewrite with a new omission span writes <OmittedScene> inside a card paragraph; rewrite after restoring a file's omission writes the body as top-level paragraphs with their original bytes; both ports assert the same literal output bytes for an omit and a restore (owner decision 2026-09-22, in place of a generated fdx.json case). Measured on an anonymised Final Draft-written FDX: omit → save → reopen shows the omission; restore → save → reopen shows the scene whole."
  - "ENGINE FIXES (owner-approved 2026-09-22), both ports: a changed scene number on a preserved paragraph is written onto its Number attribute and the paragraph keeps its tags; dual dialogue inside an omitted scene is read as its lines, and a restore or omit keeps its block's bytes."
  - "VOICEOVER: the row action, context items and menu item carry labels; the surface announces 'Scene N omitted, X pages cut' / 'Scene N restored'."
  - "SUITES: eDraftEngine, EDraftCore, EDraftUI, EDraftMacSurface and @edraft/core green; macOS Debug build succeeds."
  - 'RFC: the §7.3 amendment quotes the sentence it replaces verbatim ("Omit is **Blocked** in `development` (numbers are not addresses yet).") and argues why Omit is correct outside Production Mode — not merely records that it ships.'
  - "REPORT: names the iOS deferral (EDraftUIKitSurface gets no Omit/Restore command in this lock; the model API it would call is shared)."
