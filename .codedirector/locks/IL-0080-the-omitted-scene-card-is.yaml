utterance: "The omitted-scene card is cluttered webpage chrome — a pill reading '0.3 pgs CUT', a text button reading 'View Cut Text', a dotted rule when open. Redesign it quiet, the Apple way: at rest the line is only the word OMITTED in muted ink; hovering the line reveals a small chevron at the column's trailing edge and a gentle highlight; clicking the chevron opens the cut text inline, clicking again puts it away. The cut length leaves the page — it already lives in the Navigator row's trailing column (SceneRow.cutPages), and joins the hover tooltip and the VoiceOver label. No dotted rule."
goal: A collapsed cut scene is one quiet line — OMITTED in muted ink, nothing else — that reveals a chevron on hover and opens its cut text when the chevron is pressed. The page carries no pill and no text button; the length is read in the Navigator, the tooltip and VoiceOver.
interpretation: |
  THE DEFECT, AS SHIPPED. IL-0076 put three pieces of chrome on one line:
  sepia type, a pill ("0.3 pgs CUT" — production jargon, scheduling data
  from Final Draft's SceneProperties Length, meaningless to a writer at
  the page), and a text button ("View Cut Text"). Expanded adds a dotted
  rule. The human's verdict: "it looks like shit" and "what does 0.3 pgs
  cut mean". Both correct. Final Draft itself shows nothing but the word
  OMITTED; we out-decorated the thing we were copying.

  THE REDESIGN, IN THE CODE. All of it lives in OmittedSceneRegionView;
  the surface's placement (IL-0079's column rect) and the collapse
  mechanics (IL-0076) do not change.

    - The pill is deleted from the overlay. `OmittedScene.pillText` stays
      in EDraftCore: the Navigator row's trailing column already shows it
      where a page number would be (SceneRow.cutPages, IL-0075), and
      VoiceOver speaks it. Nothing in EDraftCore or EDraftUI changes.
    - The text-button disclosure becomes a bare chevron — chevron.right
      collapsed, chevron.down expanded — at the column's trailing edge.
      It is visible whenever the region is open; when collapsed it
      appears on hover, the way Xcode's fold ribbon does.
    - Hover also lays a quiet rounded highlight over the line, so the
      line reads as one tappable thing. The chevron carries the
      pointing-hand cursor.
    - Pressing the chevron toggles the region (mouse, or VoiceOver via
      the existing accessibilityPerformPress). Clicks elsewhere on the
      line still belong to the text — the card is a live line and the
      caret rules from IL-0075/IL-0076 are untouched.
    - The dotted rule in the expanded state is deleted. The muted ink is
      what says "cut"; the chevron on the card's line is what closes it.
    - The tooltip speaks plainly: the scene's spoken label ("Scene 21,
      omitted, 0.3 pages cut, collapsed"), which is also what VoiceOver
      says.

  PROOF. Tests, not prose: the overlay draws no pill and no text button;
  collapsed and at rest the chevron is hidden; hovered or expanded it is
  visible; pressing it toggles the region open and shut through the
  surface's own wiring; the chevron's frame never intersects the card's
  glyphs and stays inside the column (the IL-0079 framing tests are
  re-pointed at the chevron and kept). The IL-0076 collapse invariants
  and the Navigator's cut-length column are covered by their existing
  tests staying green.
