  - The RFC specifies the shape (domain, extensions, container, zone, App Group), the data model and each Files operation's mapping, sync and its wake-up path, conflicts with no silent loss, and every account, quota and network state with what the writer sees.
  - "The apps' part: open and save default to the Location, the one-time enable on iOS, On My iPhone kept, the iCloud Drive folder not shipped."
  - Every Apple claim is sourced and linked; the unknowns are named with the probe that settles each; open decisions carry a recommendation.
  - The build is a sequence of locks, each with scope, proofs, and the human's checks on two devices.
