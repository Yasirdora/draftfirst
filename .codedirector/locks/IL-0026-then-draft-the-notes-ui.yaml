accept:
  - "Opening sample0-2.fdx attaches 11 imported notes: Writer A on 8, Writer B on 3; each resolves to the line measured above (the shot holds three, a dialogue line two), and the Notes tab lists them in page order among any notes of the writer's own."
  - "Writer A and Writer B take two different palette colours; a `[[Writer A: …]]` note written in eDraft takes Writer A's colour; a note from the file without WriterName stays yellow; the file's Color attribute changes nothing on screen."
  - When the element at a note's index does not match the imported text, the note appears unanchored instead of on a wrong line.
  - On the Mac, each noted line carries one mark, tinted by its author, or neutral when authors mix; the card shows an imported note read-only — no text editor, no trash — with its author, and title and date when present.
  - "With imported notes attached: a no-edit save of sample0-2.fdx through ScreenplayFile is byte-identical; after editing the script and adding, editing and deleting the writer's own notes, the <ScriptNotes> block is byte-identical and the Fountain source contains none of the imported notes' words."
  - A Fountain document shows and saves exactly as before; every existing EDraftCore (320), EDraftUI and EDraftMacSurface test stays green, and both apps build.
  - "Seen in the running Mac app (launched by path) with sample0-2.fdx: the marks, the card and the Notes tab — a screenshot, not a claim."
