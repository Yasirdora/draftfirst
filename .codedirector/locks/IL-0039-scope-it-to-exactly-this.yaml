utterance: "Scope it to exactly this: eDraft notes on an FDX document are written into real `<ScriptNotes>` — one note per message, header grammar per RFC §4.1/4.2, Range from IL-0031's counter, kept by IL-0033 on every save. Native eDraft notes no longer save as body Note paragraphs on FDX. (Fountain files stay Fountain — unchanged.) \"Your name for notes\" asked once at first note (RFC §8) — must work on macOS, which has no Settings panel at all (found in testing today: no gear, no ⌘,). The prompt covers signing; the panel itself is v1 polish. Threads, resolve, word anchors, report: stay postponed. The 3 test notes currently in ~/Documents/sample02.fdx (\"testing this one\", \"test\", \"see [scene 4]\"): strip them as part of this lock's validation, on a copy first, then the real file with my yes. Proofs: note written in eDraft → opens in FD's navigator with author, anchored, never in the script text; no-edit save still byte-identical; all existing keeps hold. Final Draft check by the human before commit, as the RFC's stage protocol says. Draft the lock and show me the Vibe Check."
goal: A note the writer adds in eDraft to an FDX document is saved as a real Final Draft <ScriptNote> — header line per RFC §4.1/4.2, the writer's own name and role, Range over its line by IL-0031's counter, kept by IL-0033 — never as a body Note paragraph; it comes back as the writer's own note on reopen; the name is asked once at the first note, on macOS; Fountain files are unchanged; every existing keep holds.
interpretation: |
  RFC-NOTES-SYSTEM stage 1, cut to the human's list: FDX writing, the name
  prompt, and the validation on sample02. Threads, resolve, word anchors and
  the report stay postponed.

  MEASURED at ab67d4d:
    - A note added in eDraft saves into FDX as <Paragraph Type="Note"> in the
      script body. Final Draft shows it as a line of the script.
    - ~/Documents/sample02.fdx (Final Draft's save, 11:13:23 today) holds four
      eDraft test notes as body Note paragraphs ("test" twice), no ScriptNote
      of eDraft's, and two cue/speech pairs turned into Action by eDraft
      (see PREREQUISITE).
    - The note signature is seeded from NSFullUserName() on macOS
      (EditorState.swift:331), against D6 and the standing rule. Nothing is
      stored on this Mac (noteSignature, signsNotes: not set).
    - NoteAttribution.candidate rejects "(" and ")", so a `Name (Role):`
      prefix is not read as an author (D4 needs it).
    - Both apps save through ScreenplayFile.encode, so macOS and iOS share
      one save path.
    - Final Draft accepted this morning's probe: <ScriptNotes> sits after
      </Characters>. Header lines and every attribute Final Draft defines
      survived its save; only EDraft: attributes were stripped.

  THE RULES, both engines:
    1. WRITE. Each note element with no body paragraph of its own is written
       as one <ScriptNote> in <ScriptNotes>, which is created after
       </Characters> when absent. Its body is the header paragraph
       `[eDraft thread:tXXXXXX status:open from:"Name (Role)"]` (§4.1), then
       one paragraph per line of the message, with the probe's paragraph and
       text attributes. Attributes (§4.2):
         - WriterName = Name (Role), or Name alone;
         - Type="Writer"; Color unset (#000000000000);
         - WriterID a fixed placeholder; Id = the next free integer;
         - RefId, paragraph ids and DateTime/DateModified (yyyyMMddTHHmmss)
           from caller-injected generators, so the corpus is deterministic;
         - Name = the message's first words, cut at a word boundary to 40
           characters;
         - Range = the whole paragraph of the element the note sits in front
           of, by IL-0031's counter over the saved script (a trailing note:
           the last paragraph). No attribute Final Draft does not define.
    2. NEVER IN THE BODY. A new note writes no body paragraph. A body Note
       paragraph the file already has (Final Draft's own, and the four
       eDraft test notes) stays a paragraph, kept, edited or deleted as today.
    3. OWNERSHIP (§4.3). A ScriptNote is eDraft's if and only if its first
       paragraph is a well-formed header with a `thread` key. The import
       gives each of eDraft's notes back as a note element with the text
       `Name (Role): message`, placed in front of the element its Range
       starts in. Final Draft's notes stay as they are: read-only, never
       elements.
    4. PAIRING ON SAVE (stage 1). An eDraft ScriptNote whose element comes
       back unchanged on the same line keeps every byte but its Range
       (IL-0033). One whose element is gone is removed. A changed element is
       written as a new note: new Id, thread and date. Thread identity across
       edits waits for stage 2, when the header enters the editor.
    5. D3/D4. Author and message come from the element's `Name (Role):`
       prefix when it is the writer's signature. Otherwise the author is the
       stored name (D3). With no stored name, WriterName is left empty and no
       `from` is written: an iOS-only case, see below.
    6. writeFdx (a whole new file, e.g. Save As .fdx) follows rules 1, 2 and 5.

  THE NAME (§8), EDraftCore + the Mac surface:
    - The account-name seed goes. eDraft never reads a name from the system.
    - "Your name for notes", plus an optional "Your role", is asked once: the
      first time a note is added and no name is stored. Stored locally
      (UserDefaults, name + role) and signs every note after it as
      `Name (Role)`. Cancel adds no note, so every note has an author.
    - `Name (Role):` is read as an author (D4). A role is never read from
      Type.
    - Built on macOS (a sheet on the script window). iOS keeps its Settings
      row and gets no prompt in this lock.

  VALIDATION ON sample02 (the human's): strip the four test notes through
  eDraft's own save path, on a copy first, and splice the four paragraphs of
  the two broken cue/speech pairs back from the 08:18 no-edit reference.
  Check the copy: it differs from the file only in those paragraphs
  and in Range values put back. Then the real file, with the human's yes.
  (Three broken pairs, measured later, not two: two are spliced from the
  08:18 reference, the third from the Sep 9 copy, the only version where it
  is intact.)

  PREREQUISITE, found in this design pass, NOT in this lock: a note in front
  of a dialogue line serialises as `CUE` / `[[note]]` / `Speech` with blank
  lines between, and reopens as Action, Note, Action. That is how sample02's
  two pairs broke. Rule 3 places reopened notes the same way. The
  Fountain-level fix is its own lock and lands first.

  Out of scope: threads, resolve, word anchors, the report, a Settings panel,
  the iOS prompt, the Fountain carrier (Fountain files unchanged), the
  highlight carrier.
