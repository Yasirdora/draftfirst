schemaVersion: 1
id: IL-0043
status: verified
utterance: "why it shows testing twice, once as header and once as body? — and: you could use title to add eDraft"
goal: A note eDraft writes into Final Draft carries no title of its own — Name is empty, the way Final Draft writes an untitled note — so Final Draft shows the writer's words once; in both engines, with every IL-0041 and IL-0042 keep holding.
interpretation: |
  From the human's Final Draft check of IL-0042 (uncommitted): a short note
  shows twice — once as the bold title, once as the text — because eDraft
  fills Final Draft's `Name` (the title) with the note's first words. The
  human's direction: use the title to mark eDraft.

  MEASURED:
    - Final Draft's own notes on this Mac (677, in 60 files): 308 have an
      empty title, 1 none; none repeats its body's opening. Final Draft never
      writes the words twice.
    - Through a Final Draft edit (probe-B, note 900): Name, Type, RefId,
      Color, Range and DateTime are kept; WriterName, WriterID and
      DateModified are re-stamped. So a mark in the title survives someone
      editing the note in Final Draft, where IL-0042's mark in the author
      field is lost.

  THE RULES, both engines, FDX only — superseding IL-0042's author-field mark:
    1. WRITE. A note of the writer's is one <ScriptNote> as in IL-0042, with
       `Name` = `[eDraft]` (the title Final Draft shows in bold) and
       `WriterName` = the writer's name alone, empty when none is known.
       `Type` is the role, empty when there is none. The body is only the
       words. The note's words are never copied into the title.
    2. OWNERSHIP. A ScriptNote is eDraft's if and only if its `Name`, trimmed,
       is `[eDraft]`. It stays eDraft's when someone edits it in Final Draft
       (measured: the title is kept); a Final Draft user who retitles it makes
       it Final Draft's.
    3. READ BACK. An eDraft note returns as the writer's own note element,
       `Name (Role): words`, the name from `WriterName` — which, after an edit
       in Final Draft, is whoever edited it (D9, last editor) — the role from
       `Type`.
    4. Everything else as IL-0041/IL-0042: Ranges, pairing, placement, the
       name prompt, no header line, no attribute Final Draft does not define.
       A file written by IL-0042's builds (the mark in the author field) reads
       as Final Draft's notes — test files only.

  RFC: D8 and D9 amended again (the carrier is the title; a Final Draft edit
  keeps the note eDraft's, authored by the editor); §4.2, §4.3 and §8; §3 gains
  the measured list of what a Final Draft edit keeps; stage 1 status.
