status: verified
utterance: |-
  Claude commits IL-0107 (feedback address), then runs IL-0108 (shortcuts) — you'll feel that one immediately: ⌘9 becomes Lyrics everywhere, Zoom to Fit moves to ⌥⌘0, and ⌘Z in the launch window restores a trashed script like Finder.
  Then the blank-line-note fix (IL-0111) — it'll come back with a measured budget first.
  Then IL-0109 — the big one: omitted scenes stop leaking into print/PDF/export, and exports stop dropping your notes and outline.
  Then IL-0110 — real .draft files that keep highlights and omissions.
goal: "A note with a blank line in it survives Fountain in both engines: the writer spells each blank line between a note's first and last lines as two spaces (Fountain's connected blank line), the reader gives a line of spaces inside a note back empty, and a note without one is written exactly as before — so a writer's note in two paragraphs no longer reopens as two printing lines of script. Pinned by a shared corpus case and mirrored tests in TypeScript and Swift, and by an EDraftCore save-and-reopen test."
interpretation: |
  A DEFECT OUTSIDE THE FIVE, FOUND BY IL-0109'S SPIKE (2026-09-25); taken into
  the batch by the owner, before IL-0109. SIZED BY A SPIKE on dbdf912 +
  IL-0108 (the tree it lands on); nothing in the tree is touched until this
  lock is active. The run copies the spike's 13 files in.

  THE DEFECT, MEASURED. A blank line is Fountain's paragraph break. Both
  engines' `noteBody` (Serialise.swift, packages/edraft/src/serialise.ts)
  wrote it inside a note as it was; the reader found no close before the
  break and read the note — brackets and all — as action. A writer's note
  "First thought. / (blank) / Second thought." added, saved and reopened comes
  back as the script lines "[[First thought." and "Second thought.]]": the
  note is gone and its words print. It hits every Fountain-text save
  (.fountain; .draft until IL-0110), the web editor through the same engine,
  and IL-0109's Export ▸ Fountain of the fixtures' Final Draft note in five
  paragraphs. Both readers already keep a note open across a line of two
  spaces (hasNoteCloseBeforeParagraphBreak), keeping the spaces in its text.

  THE FIX (both engines, mirrored):
  - Writer: each whitespace-only line strictly between a note's first and
    last lines is written as two spaces. The first line follows `[[` and the
    last runs into `]]`, so they are never blank on the page — a note with no
    interior blank line is written byte for byte as before (the twelve
    existing corpus cases regenerate unchanged).
  - Reader: a line of nothing but spaces inside a note reads back empty.
  - Lossy by choice, one way: a line the writer filled with spaces comes
    back empty (RFC-NOTES-SYSTEM §13, beside IL-0038's `] ]`).
  - RFC-NOTES-SYSTEM §4.4 gains the rule; §13 the asymmetry, and that a note
    broken by an older build stays broken — a scan of the 12 text scripts on
    the owner's Mac found none. packages/edraft CHANGELOG: Fixed.

  TESTS:
  - Shared corpus case `note-blank-lines` (scripts/engine-conformance-export.mjs
    → parse.json, serialise.json; draft.json derives its per-corpus case
    from it, +8 lines): a note with one blank line, a one-line note (bytes
    unchanged), and a note of three paragraphs on a speech, written in front
    of the cue as IL-0040 writes every note of several lines there. The Swift
    conformance suites' corpus count goes from 12 to 13.
  - packages/edraft parse.test.ts and FountainConformanceTests.swift, a
    mirrored block of 7: four notes with blank lines survive save and reopen;
    the blank line is written as two spaces; a two-paragraph note on a speech
    goes in front of its cue whole and the speech survives; the chosen
    asymmetry.
  - EDraftCore NoteBlankLineTests: a note the writer adds in two paragraphs
    survives save and reopen, and nothing of it is on the page.
  FAIL-BEFORE (spike: the new tests and corpus against the unfixed engines):
  TypeScript 7 of 7 fail; Swift the new suite, and the corpus case in parse,
  serialise and round trip; EDraftCore 1 of 1 (the note reopens as two script
  lines).
  AFTER (spike): packages/edraft 923/923; web app vitest 47/47; npm run check
  0; corpus regenerated, only the new case added (plus draft.json's derived
  case); eDraftEngine 263 tests pass; EDraftCore 430/0; EDraftUI 72/0;
  EDraftMacSurface 404 (7 skipped)/0; macOS Debug and iOS Simulator builds
  succeed. With this lock's engine files, IL-0109's spike passes all 9 of its
  core tests, including the one this defect blocked.
  MEASURED: 13 files, 350 lines.
