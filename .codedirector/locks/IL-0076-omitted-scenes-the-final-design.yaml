status: verified
utterance: "Omitted scenes, the final design — collapsed, not struck. Collapsed by default: the cut scene is out of the script's flow, one calm line in its place — SCENE 21 OMITTED in a muted sepia-brown, with a pill reading the cut length and a disclosure control, \"View Cut Text\". Expanded on demand: the body renders in the same muted sepia, keeping its scene number, bounded by a dotted rule. Caret and edits still refused; selection and copy still allowed. The struck-through attribute path is replaced, not kept as a fallback."
goal: "An omitted scene is collapsed out of the script's flow on the Mac: one sepia line in its place carrying the scene number, a cut-length pill and a disclosure that expands the body in the same sepia, bounded by a dotted rule — the span never reaching the canvas when collapsed, so the page canvas and the page count finally agree — with the caret and edits still refused, selection and copy still allowed, and IL-0075's struck-ink path removed rather than kept."
interpretation: |
  THE COLLAPSE MECHANICS — the design the human asked to read first.

  MEASURED, and it decides the shape. The Mac surface lays the whole script
  into one NSAttributedString and keeps `ScriptSurface.ranges:
  [ElementRange]` beside it. That array is **parallel to
  `editor.screenplay.elements`**, and the parallelism is load-bearing: the
  surface walks `ranges.enumerated()` and indexes `elements[index]` off the
  same integer (ScriptSurface, the selection sweep at ~3090 and the kind
  change under it). So a collapsed span cannot simply be dropped from
  `ranges` — every positional lookup after it would point at the wrong line.

  THE RULE, one sentence: *a collapsed element keeps its entry in `ranges`
  and that entry is empty, located at the placeholder line.*

  From which everything follows:

    - `ScriptLayout.attributedScript` is told which spans are collapsed. In
      place of a collapsed span's elements it appends **one placeholder
      paragraph** — `SCENE 21 OMITTED` — in the omitted sepia, and gives
      every element of the span a zero-length `ElementRange` at that
      paragraph's start.
    - Coordinates stay internally consistent because the placeholder is
      *text*. Nothing needs a coordinate transform, no view is asked to lie
      about its geometry, and TextKit is never told about a range that is
      not in the storage.
    - The caret and the keystroke refusals from IL-0075 keep working by
      construction: an empty range intersects no selection, so
      `touchesOmitted` answers false for a collapsed span, and there is no
      body text to put a caret in. Expanded, the ranges are real again and
      the same refusal does the work it does today.
    - The body never reaches the canvas when collapsed, so pagination and
      the page canvas see the same text at last. **This is what closes the
      inconsistency IL-0075's report recorded** — the page count and the
      sheet stop disagreeing, and they stop disagreeing because there is
      one text, not because two paginators were taught the same trick.

  THE PILL AND THE DISCLOSURE are an overlay view anchored to the
  placeholder line's rect, not an NSTextAttachment: the house already draws
  page-break markers, reveal highlights and the ghost this way, the storage
  stays plain text (so find and copy behave), and the control is a real
  NSView that can carry the accessibility label. It reads
  "Scene 21, omitted, 0.3 pages cut, collapsed".

  EXPANDED, the span's elements lay out normally in the same sepia, keep
  their scene number, and the same overlay closes the region with a dotted
  rule at its foot. The state is a `Set<DraftElementID>` on the surface —
  not in the document, not in the file, not persisted — so a close and
  reopen comes back collapsed. A test says so rather than this paragraph.

  THE STRUCK PATH GOES. `ScriptLayout.omittedInk` as a strikethrough
  attribute and the strike in the Navigator row are removed, not kept
  behind a flag. What stays is everything under them: the span tracked by
  DraftElementID, `Omissions.resolve`, the caret and edit refusals, and the
  page-count rule measured from Final Draft.

  THE PILL'S NUMBER HAS A PROBLEM, AND IT IS NAMED. The brief says to use
  `SceneProperties Length` when the file records one. Measured: the engine
  does not model it. `Length` is paragraph metadata — preserved in the
  origin's bytes, never read into `ScreenplayElement`, and there is no
  `length` anywhere on the engine model. So the recorded value can only
  reach the surface if EDraftCore reads it out of the `origin` string it
  already holds, beside the `Fdx.parse(origin)` it already runs. That is
  what this lock does: a narrow scan for each `<OmittedScene>`'s first
  `<SceneProperties Length="…">`, in document order. The alternative is an
  engine change, and the engine is denied. Both paths the brief asks for
  are built and pinned: the recorded length when the file has one, and a
  length computed by paginating the span when it does not.

  NOT IN THIS LOCK: restore or un-omit (Production Mode, §7.3); printing
  and PDF, whose callers are the app target and EDraftUI's document —
  §7.3's "the body MUST NOT print" still waits on a seam this lock does not
  own, and the collapse does not by itself change what `pdfData` emits.
