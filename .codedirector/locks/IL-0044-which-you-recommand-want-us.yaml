  - "The .draft PDF section: the associated-file carrier, the page map, comments imported as notes on their words with replies and state, a reader per platform, the /Keywords fallback, eDraft's paginator as the authority and omnipdf's role — the scratchpad probe recorded as measured, and Acrobat, iPad Markup and mail filters named as unproven, each with the check that settles it."
  - The measured baseline is recorded with its numbers — sizes, parse times, the highlight loss, the legacy count, Beat's trailer, the PDF probe — counts only.
  - The acceptance bars against .fdx are stated as tests the build locks must pass.
  - The stages are locks, each with scope and proofs; the open decisions are named with a recommendation each.
  - RFC-NOTES-SYSTEM's stage 2 points to RFC-DRAFT-FORMAT, and its two IL-0039 mentions read IL-0041; VISION.md no longer says Fountain is the file.
  - Every outside source is linked.
