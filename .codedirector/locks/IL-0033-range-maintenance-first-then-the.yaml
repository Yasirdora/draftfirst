id: IL-0033
status: verified
utterance: Range maintenance first, then the rebase immediately after. The rebased file's Ranges are authentic; I don't want a single eDraft save touching them before the lock that keeps them on their words. Draft Range maintenance now.
goal: "A save keeps every Final Draft ScriptNote on its words: each Range value whose words moved is rewritten to where they now are, counted as Final Draft counts, and no other byte of <ScriptNotes> changes — in both engines, proven on the Final Draft-written fixtures through the app's path."
interpretation: |
  The Range-maintenance lock the human queued (decision 1=B: rewrite only the
  Range values of ScriptNotes whose words moved), ahead of the rebase onto
  ~/Documents/sample02.fdx, whose Ranges are authentic and must not meet an
  eDraft save that drifts them.

  MEASURED at 1101db9, through the app's path (Fountain reading + unedited
  gate), save then reopen, comparing the words each note covers:

    finaldraft-sample02.fdx, 11 notes
      a word typed in the third line   10 notes off their words
      a line added near the start      10 off
      a line deleted near the start    10 off, 1 with no anchor
    finaldraft-sample01.fdx, 12 notes: the same, 11 off

  The save copies <ScriptNotes> byte for byte, so every Range after an edit
  counts positions in a script that is no longer there. (The note left on its
  words in each case is the one at the very end, zero-length.)

  THE RULES, both engines, preserving save only:

    1. Positions are counted as Final Draft counts them (IL-0031): UTF-16
       units over the saved script's top-level paragraphs, one per
       paragraph break, End of Act included, two for each embedded block.
    2. Each end of a Range stays with its character. A Range whose words the
       writer did not touch is rewritten to where those words now are. A
       Range whose words the writer edited keeps its start before its first
       surviving character and its end after its last: text typed inside the
       note joins it, text typed at its edges does not.
    3. A Range whose words were all deleted collapses to zero length at the
       place the words stood, and is reported by name:
       FDX_REWRITE_SCRIPT_NOTE_WORDS_DELETED. (Decided by the human: (a).)
    4. Where a dual dialogue is dissolved, a Range on the block's two units
       moves to the start of its first line.
    5. A Range already stale when the file was opened (starting past the
       script) keeps its bytes; so does every Range that does not move. A
       reversed pair keeps its order.
    6. Only Range attribute values change. Ids, authors, dates, colours,
       bodies, and every byte of <ScriptNotes> outside a moved Range value
       stay as they are. TypeScript reports how many Ranges moved
       (FDX_REWRITE_SCRIPT_NOTE_RANGES_MOVED, informational).

  HOW: the save records which original paragraph each top-level paragraph
  it writes came from (verbatim, merged, rewritten, restored, a dual
  dialogue's frame, or new), reads the saved script's layout with the
  IL-0031 counter, and maps each Range end through that record: unchanged
  offsets for paragraphs written as their bytes, character alignment within
  paragraphs whose text changed.

  Out of scope: DateModified is not touched; notes written by eDraft into
  <ScriptNotes> (the later lock); the fresh export (no ScriptNotes).
