accept:
  - The RFC maps each of the seven principles to a mechanism, a carrier in each format (Fountain, FDX, PDF) and an interface on macOS and iOS.
  - The six stages (round trip, threads, resolve, range anchors, report export, polish) are each a lock with scope, proofs, and the Final Draft checks it waits on.
  - Every IL-0024–IL-0033 keep is listed as permanent; no login appears; open decisions and unproven risks are named.
  - The probe’s results (Final Draft 13.4.0 build 120, 2026-09-18) are cited as measured, saying which were byte-verified and which were the human’s observation.
  - WriterName is treated as last editor; provenance (author and role) lives in the header line; a note’s author is never derived from the system.
