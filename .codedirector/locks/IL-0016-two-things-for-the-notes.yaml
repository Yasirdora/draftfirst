status: verified
utterance: two things for the notes tab. there's no filter on it like the other tabs have. and notes should show who wrote them — director, writer, whoever — with color coding so you can see at a glance in script as well who said what. research how screenwriting apps handle this first, what would be the best approach and do it properly with professionalism.
goal: A note carries an author, and the author decides its colour. The Notes tab gains the filter control Scenes and Cast already have, filtering by who wrote the note, and each row shows the author with a colour dot. In the script, a line's note marker takes its author's colour instead of the one fixed yellow. Identity is a name the writer sets, seeded from the system account name; notes written in eDraft are stamped with it, and notes that have no author stay unattributed and keep today's yellow. Swift surfaces only — the FDX ScriptNote round-trip in both engines is a second lock.
interpretation: "Researched first, as asked. Final Draft shows an author and date on every ScriptNote and gives collaborators a per-person colour matching their cursor; Arc Studio and WriterDuet colour comments by person. Colour-by-person is what the utterance asks for. The blocker is storage, and it was measured, not assumed: the document's save format IS Fountain text (ScreenplayDocument: \"a screenplay's source IS plain text\"), [[note]] has no attribute space, and element ids are regenerated on every parse — so a model field evaporates on save and an id-keyed sidecar rots on reload. Both were rejected on evidence. The author therefore lives in the note's own text as a Name: prefix, which measured byte-identical through a Fountain round trip and is the convention writers already use by hand. Recognition is conservative: a prefix is an author only when it matches the configured signature or prefixes two or more notes in the document, so a one-off TODO: is never mistaken for a person. Colour is derived from the recognised name into a stable palette slot, paper-keyed the way screenplayNoteTint is so it cannot go muddy on an inverted page. The Notes tab gains the menu control beside its search field that Scenes and Cast already have, filtering by author. Unattributed notes keep today's yellow, so a script with no authors looks exactly as it does now."
keep:
  - kind: no-new-dependency
  - kind: custom
    text: the save format is unchanged — no new document format, no sidecar, no new model field; a note's author is read from and written to the note's own text
  - kind: custom
    text: an author is never invented — a prefix is attributed only when it matches the configured signature or prefixes two or more notes in the document
  - kind: custom
    text: a note with no recognised author keeps today's screenplayNoteTint, so a script with no authors is visually unchanged
  - kind: custom
    text: signing is off by default, and nothing rewrites the text of notes that already exist
  - kind: custom
    text: the author palette is paper-keyed like screenplayNoteTint, never app-keyed, so it survives an inverted page
  - kind: custom
    text: the Scenes and Cast lists, their filters and their sort order are unchanged
  - kind: custom
    text: engine packages packages/edraft and apple/eDraftEngine are untouched — the FDX ScriptNote round trip is Lock B
