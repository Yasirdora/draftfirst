accept:
  - New identity regression tests demonstrate failure against the baseline in both ports before implementation.
  - Existing corpus expectations remain byte-for-byte unchanged; new identity cases generated by exporter agree in both engines.
  - All live document script elements have IDs; typing and styling retain them; split keeps first ID and allocates exactly one; merge retires the second.
  - Core and native undo/redo restore IDs but never rewind the allocator; divergent edits never reuse retired IDs; transfers mint destination IDs.
  - Draft script.json preserves IDs and nextId through document round-trips; Fountain IDs are explicitly session-stable only.
  - npm test and all three Swift package suites pass, including the readable full external Core corpus; private DerivedData macOS Debug build succeeds, with unsigned fallback disclosed if keychain signing stalls.
  - No commits; no UI/iOS/save wiring/omission migration, dependency changes or protected-file modifications.
assumptions:
  - text: Raw parser/import projections retain existing identity-free wire expectations. The new identity-bearing document boundary requires IDs for every adopted script element; Core uses it in live edits, not merely export.
    source: system
    confirmed: false
  - text: Persistent IDs and transient UI UUIDs are separate. Return-at-start persistent ownership follows the first half even though current UI UUID ownership follows the second.
    source: system
    confirmed: false
  - text: Fountain session identity and counter high-water undo semantics will be recorded in RFC Open Questions; serialized foreign IDs are opaque and must not collide with newly allocated IDs.
    source: system
    confirmed: false
