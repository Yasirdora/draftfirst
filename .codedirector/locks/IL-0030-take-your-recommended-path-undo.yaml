schemaVersion: 1
id: IL-0030
status: verified
utterance: "Take your recommended path: undo IL-0028, commit the hook under its own small lock, then re-run the same apply for a clean record."
goal: "Editing a paragraph of a Final Draft file in eDraft changes only the characters the writer changed. The paragraph keeps its Type, attributes and nested blocks, its production tags, revision marks, run splits and AllCaps styling on every untouched word, its stored casing, its line breaks and its trailing whitespace; nothing Fountain added (a #2#, a leading '.') is ever written into the file. Proven on the Final Draft-written fixtures in both engines and through the app's own path, each proof failing on the IL-0027 save."
interpretation: |
  The lock the human approved to follow IL-0027 immediately ("edited
  paragraphs keep what the writer didn't touch"), ahead of the counting fix;
  the rebase onto sample02.fdx waits for it. Measured 2026-09-17 at 72a63c2,
  through the app's path (Fountain reading + IL-0027's unedited gate), one
  small edit per hazard on finaldraft-sample02.fdx / finaldraft-sample01.fdx:

    E1  typo fix in a tagged action line: 11 runs collapse to one; 5 tags and
        a revision mark lost.
    E2  "(X1)" → "(X2)" in the emphasised numbered heading Fountain reads as
        Action: the paragraph becomes Type="Action"; its SceneProperties, arc
        beats, Number and id are gone; 7 tags lost; and the literal " #2#"
        (Fountain's scene-number syntax) is written into the script's text.
    E3b the italic "(beat)" after dialogue, edited: becomes Type="Dialogue".
    E4  second line of a multi-line Summary edited: the Summary is cut at its
        line break and the line becomes a new Action paragraph.
    E5  edit early in a line that ends in a space: the space is dropped.
    E6  edit in an action line with an AllCaps-styled word: that word's stored
        letters are rewritten in capitals, its AllCaps style and 3 tags lost.
    E7  a plain scene heading edited: its scene data survives, its 5 tags don't.

  Cause, in one sentence: an edited paragraph is rewritten from the edited
  ELEMENT — Fountain's representation — instead of having the writer's change
  applied to the FILE's paragraph.

  THE FIX: A THREE-WAY MERGE PER EDITED PARAGRAPH, written in the file's terms.
  For a paragraph F with its unedited reading U (IL-0027's correspondence) and
  the edited element(s) E:

    1. The writer's change is U → E (common prefix and suffix, UTF-16).
    2. U is aligned with F's own text character by character, casing aside, so
       what Fountain added (" #2#", a leading ".") and what it dropped (a
       trailing space, the file's casing) are known.
    3. The change is applied to F: replaced characters are the file characters
       matched to the replaced reading characters; a pure insertion deletes no
       file-only character; an insertion is placed beside characters the file
       actually has. An edit that cannot be placed that way — one that touches
       only characters Fountain added, or whose placement is ambiguous — is not
       guessed: that paragraph takes today's path, and the TypeScript result
       reports it (FDX_REWRITE_EDIT_UNPLACED).
    4. Runs: every <Text> run wholly outside the changed characters is written
       as its original bytes. A run the change falls in keeps its opening tag
       — every attribute — around its new text. Emphasis the writer changed
       (bold, italic, underline, strikeout: what Fountain carries) is applied
       to the file's runs over that range; everything Fountain cannot carry
       (TagNumber, RevisionID, AdornmentStyle, Font, Size, AllCaps, HiddenText,
       the eDraft highlight) stays as the file had it.
    5. Type: if the writer did not change the element's kind in eDraft (E and U
       agree), the file's Type stands — the heading Fountain reads as Action
       stays a Scene Heading, the (beat) stays a Parenthetical. If they did,
       the paragraph is retyped as today, attributes and nested blocks kept.
    6. A paragraph Fountain split at its line breaks is merged over its joined
       lines, so it stays one paragraph with its line breaks — when the writer
       edited lines in place. Lines added or removed inside it take today's
       path.

  Prototyped on E1–E8 text: every case gives the file's paragraph with only the
  writer's characters changed (casing kept, no #2#, no ".", the line break and
  trailing space kept); two placement edge cases found and turned into rules 3's
  wording (an insertion beside a Fountain artifact; an append at the very end).

  PROOF, same rigor as IL-0027: each measured case as a corpus case and a test
  in both engines and through ScreenplayFile/EditorState; an edit sweep across
  both fixtures asserting that bytes change only inside the edited <Text> runs
  (not merely inside the paragraph) and that every tag on an untouched word
  survives; every new proof shown failing on the IL-0027 save. The no-edit
  proofs and the provenance guard stay as they are.
keep:
  - kind: no-new-dependency
  - kind: custom
    text: an edit through the app's path changes only the <Text> runs the edited characters fall in — every other byte of the file, the paragraph's own opening tag and nested blocks included, is unchanged; proven by a sweep over both Final Draft-written fixtures in both engines
  - kind: custom
    text: the file's Type stands unless the writer changed the element's kind in eDraft; nothing Fountain added is written into the file; stored casing, line breaks and trailing whitespace outside the changed characters are kept
  - kind: custom
    text: an edit that cannot be placed without guessing takes today's path and is reported — never a guessed placement
  - kind: custom
    text: each measured case (E1–E7, E3b) is a proof that fails on the IL-0027 save (recorded in the run)
  - kind: custom
    text: no-edit saves stay byte-identical, the provenance guard and both fixtures are unchanged, and the import, the ScriptNotes reader and the fresh export have no changed lines
  - kind: custom
    text: the Fountain parser and serialiser, the model and EditorState are unchanged
  - kind: custom
    text: every existing fdx.json case keeps its expected output except the IL-0027 case that pinned today's damage (unedited-split-paragraph-one-line-edited), whose change is the fix, reviewed
  - kind: custom
    text: both ports produce identical rewrite output for every corpus case
