accept:
  - "E1–E7 and E3b, re-run through the app's path: each paragraph comes back as the file's own with only the writer's characters changed — Type, SceneProperties, Number, id, tags, revision marks, AdornmentStyle, AllCaps and stored casing on untouched words, line breaks and trailing whitespace all kept; no '#2#' or leading '.' in the file."
  - "Sweep: an edit through Fountain at ≥10 positions in each fixture changes bytes only inside the <Text> runs it falls in; every TagNumber outside those runs survives. Both engines."
  - Each E-case proof fails on the IL-0027 save (TypeScript and the app's Swift path).
  - An unplaceable edit takes today's path and TypeScript reports FDX_REWRITE_EDIT_UNPLACED; a synthetic case pins it.
  - "No-edit proofs, provenance guard and all other corpus cases unchanged; suites green: 671 TypeScript, 182 Swift engine, EDraftCore."
assumptions:
  - text: Budget replaced by hand. The auto-draft anchored on the words 'run' and 'check' (the conformance scripts) with low confidence, and proposed a paste gate, Fountain emphasis and an iOS navigator test.
    source: system
    confirmed: false
  - text: "Approved by the human before drafting: IL-0028 follows IL-0027 immediately, ahead of the counting fix; the rebase onto sample02.fdx waits for both."
    source: user
    confirmed: true
  - text: "Decided by the human — inserted text inherits its run's attributes (text typed inside a run, or at its end): tags, Font, Size, AdornmentStyle, AllCaps; never RevisionID — revision marks belong to the file's own history."
    source: user
    confirmed: true
  - text: Scope approved by the human as drafted.
    source: user
    confirmed: true
  - text: "Out of scope, noted: Fountain's own losses are routed around, not fixed — a Fountain export still reads an emphasised heading as Action; the eDraft highlight still cannot travel through Fountain; dual-dialogue speech is still invisible (its own lock, next after the counting fix)."
    source: system
    confirmed: false
  - text: "maxLines 2,200: engine ~400 lines per port, tests ~600, corpus ~500, changelog. The fixtures are not touched (denied)."
    source: system
    confirmed: false
  - text: "Carried unchanged from IL-0028, which the human approved. IL-0028's first run applied these exact bytes and passed its verify command, but was marked FAILED because Code Director 0.4.5 read the human's pre-existing untracked .githooks/ as a change (logged for Code Director). The human chose: undo IL-0028, commit the hook under its own lock (IL-0029, verified), re-run the same apply for a clean record. A failed lock is history and cannot be re-activated, so the same contract runs as IL-0030."
    source: user
    confirmed: true
