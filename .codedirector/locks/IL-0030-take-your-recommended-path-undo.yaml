change: "An edited paragraph of a Final Draft file is merged, not rewritten: the writer's change (unedited reading → edited element) is placed onto the file's own paragraph by character alignment, runs outside the change keep their bytes, runs inside keep their attributes, and the file's Type, casing, line breaks and whitespace stand — in both engines, proven on the Final Draft-written fixtures."
verifyCommand: npm run typecheck --workspace=@edraft/core && npm run test:package && npm run package:build && node scripts/engine-conformance-export.mjs && swift test --package-path apple/eDraftEngine && swift test --package-path apple/EDraftCore
