interpretation: |
  THE PLACEHOLDER. Every literal [SUPPORT EMAIL] a reader can reach becomes
  support@edraft.xyz (the owner's answer, 2026-09-23), in the mailto: href
  and in visible text alike:
  - src/routes/help/+page.svelte:152 — the home page's Email support button;
  - src/routes/help/[slug]/+page.svelte:73 — every article's contact strip;
  - src/routes/privacy/+page.svelte:50 — the privacy page, href and text;
  - docs/privacy-policy.txt:35 — the policy's text copy;
  - docs/privacy-policy.html:48 — the policy's HTML copy, href and text.
    Not named by the owner; found by the scoping grep and proposed under
    their rule "same placeholder class, one lock" — in only if they say yes.
  docs/APP-STORE-READINESS.md cites the placeholder as evidence in a dated
  audit and is left as the record it is.

  THE HEADING. src/routes/help/+page.svelte:109-110 read "Popular" / "The
  answers people look for most." — a claim about reader behaviour eDraft
  has no data for (Data Not Collected). They become "Start here" /
  "Common tasks." The popularArticles list, the markup, ids and classes
  are unchanged.

  NOT CHANGED. The policies' "Last updated" dates: filling in a contact
  address is not a change of practice, which is what the policy says the
  date tracks. The help pages' GitHub links (github.com/Yasirdora/edraft,
  which GitHub resolves to Yasirdora/eDraft) and all other copy.
