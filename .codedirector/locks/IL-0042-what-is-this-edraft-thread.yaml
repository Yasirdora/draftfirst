  - "OWNERSHIP: a ScriptNote with WriterName `[eDraft] …` comes back as the writer's own note, `Dana Reyes (Director): words`; one whose WriterName Final Draft re-stamped (no `[eDraft]`) stays Final Draft's, read-only; a note with a header line and no `[eDraft]` name is Final Draft's."
  - "REOPEN AND SAVE: no-edit save byte-identical; an edit elsewhere moves only its Range; deleted, it goes; changed, it is written again (stage 1) — the IL-0041 cases, regenerated in the new form, identical in both ports."
  - "KEEPS: both Final Draft-written fixtures save with no edit to identical bytes; Final Draft's notes keep every byte but their Ranges; Fountain corpus byte-identical; every corpus expectation from before IL-0041 unchanged."
  - "RFC: D4, D8, D9 amended with the measured facts; §3 fact 4 corrected; stages 2 and 3 marked as needing a new carrier."
  - "Final Draft check by the human before commit: the note shows `[eDraft] Name` on top, the role in the Type dropdown, and only the words in its body."
  - "Suites green: TypeScript, Swift engine, EDraftCore, the Mac notes suite, EDraftUI builds, the Mac app builds."
