    text: Final Draft's own ScriptNotes keep every byte but their Range values, a body Note paragraph already in a file stays a paragraph, and no attribute Final Draft does not define is written
  - kind: custom
    text: no header line and no marker is written into any note's text; the writer's words are the note's whole body
  - kind: custom
    text: Fountain is unchanged — parse.json, serialise.json, paginate.json and predict.json regenerate byte-identical — and every corpus expectation from before IL-0041 is unchanged; both ports produce identical files for every case
