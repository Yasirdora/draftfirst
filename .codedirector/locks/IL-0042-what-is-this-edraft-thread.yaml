id: IL-0042
status: verified
utterance: 'what is this: [eDraft thread:tubg4hj status:open from:"Y (Director)"] and why you added this. You could simple put [eDraft] in front of name or before it. the fdx already has a drop down for the role so it is not necessary in front of the name. look on top it say director and at the bottom selector says writer. — Chosen: [eDraft] in the name. No header line. WriterName reads "[eDraft] Y" and the role goes in Type.'
goal: "eDraft's notes in an FDX document carry no header line: the author field reads \"[eDraft] Name\", the role is Final Draft's Type, and the note's body is only the writer's words; a note is eDraft's while its WriterName starts \"[eDraft] \", comes back as the writer's own on reopen, and becomes Final Draft's once Final Draft re-stamps it — in both engines, with every IL-0041 keep holding."
interpretation: |
  Found in the human's Final Draft check of IL-0041 (uncommitted): the header
  line `[eDraft thread:… status:open from:"Name (Role)"]` shows as the first
  line of every eDraft note in Final Draft, and the role duplicates the Type
  dropdown. The human chose: `[eDraft]` in the name, the role in Type, no
  header line. This reverses RFC D4 (role inside the name), D8 (the header
  line as the carrier) and D9 (authorship in the header).

  MEASURED from this morning's probe files, byte for byte:
    - A plain Final Draft save keeps RefId, WriterID, WriterName and Type.
    - Editing a note in Final Draft re-stamps WriterName (to the Mac account's
      name) and WriterID; RefId and Type stay. (RFC §3 fact 4 said the edit was
      only observed; probe-B holds it — note 900. Corrected in the RFC.)
    - Final Draft opens eDraft's notes as notes, with author and date, never in
      the script text (the human's check of IL-0041).

  THE RULES, both engines, FDX only:
    1. WRITE. A note of the writer's is one <ScriptNote> as in IL-0041, without
       the header paragraph: its body is only the message, one paragraph per
       line. WriterName is `[eDraft] Name`, or `[eDraft]` alone when no name
       is known. Type is the role, or empty when there is none. Every other
       attribute as IL-0041.
    2. OWNERSHIP. A ScriptNote is eDraft's if and only if its WriterName is
       `[eDraft]` or starts `[eDraft] `. Final Draft re-stamps WriterName when
       anyone edits a note there, so an edited note becomes Final Draft's —
       read-only in eDraft, as every Final Draft note is (measured).
    3. READ BACK. An eDraft note returns as the writer's own note element,
       `Name (Role): words` — the name from WriterName, the role from Type —
       or `Name: words`, or the words alone.
    4. PAIRING, Ranges, placement, the name prompt: unchanged from IL-0041.
    5. The header grammar (parseNoteHeader, noteHeaderLine, NoteHeaderField)
       is removed from both engines: nothing writes or reads it now. A file
       written by today's test builds, with a header line, reads as Final
       Draft's notes — test files only.

  RFC: D4, D8 and D9 amended; §3 fact 4 corrected; §4.2 and §4.3 rewritten;
  §8 read rules; §11 stage 1 status; stages 2 and 3 note that threads and
  resolve need a new carrier (the header is gone). Fountain unchanged.

  Out of scope, reported: a note on an empty line gets a zero-length Range;
  within one session, a second save writes eDraft's notes again as new ones
  (the document keeps the file as opened — app document class, outside this
  lock).
