utterance: look at the video in desktop folder see how can we make our 3 tabs like this, glass effect macOS 27 exactly like the video. is it possible
goal: "Probe only, no production change. Add a throwaway probe under apple/EDraftUI/Tests/EDraftUITests/ that measures two unverified claims about NSGlassEffectView on macOS 27: (1) whether NSGlassEffectView.effectIsInteractive (new in macOS 27.0) renders the specular/chromatic press response seen in the reference video, and (2) whether a sibling NSTextField placed BELOW the glass chip in z-order is actually refracted by it, or whether NSGlassEffectView only refracts the window backdrop. Report measured numbers (per-channel divergence across the chip's leading edge over a label) so the MacScopeBar change can be made on evidence. StoryPanel.swift must not change in this lock."
interpretation: Add one throwaway probe file to the existing EDraftUITests target that builds an offscreen-but-rendered NSWindow containing a groove, three labels and an NSGlassEffectView chip, captures the window, and samples pixels to answer two yes/no questions with numbers — does effectIsInteractive change the rendering, and does a label placed below the chip in z-order get refracted. No production source is touched.
