schemaVersion: 1
id: IL-0024
status: verified
utterance: "Lock B, FDX imported notes. Context: sample0-2.fdx (in ~/Documents) has 11 ScriptNotes with WriterName attributes that survive our round-trip but surface nowhere. Two decisions are settled: (1) display color is derived from the author, overriding the file's per-note colors at display level only — never rewrite the file's bytes; round-trip fidelity is a hard keep. (2) Authorship comes from the file's WriterName for imported notes; no login system, ever. Your job tonight: design pass first, then implement the engine layer under one or more locks — parse ScriptNotes with their WriterName into the note model in both engine ports (packages/edraft and apple/eDraftEngine), with conformance fixtures built from sample0-2.fdx (copy it into the repo as a fixture)."
goal: "Opening a Final Draft file yields its ScriptNotes as structured notes beside the screenplay, in both engines, identically: each note carries its author from WriterName, its title, category, dates, the file's Range, the element and offsets that Range lands on, and its body text. Nothing about saving changes — the file's bytes, including the whole ScriptNotes block, round-trip exactly as they do today. Both ports are pinned by conformance fixtures built from sample0-2.fdx, committed as a fixture."
interpretation: |
  Design pass first, as asked; every choice below was measured on
  ~/Documents/sample0-2.fdx on 2026-09-17, not assumed.

  THE MODEL. A ScriptNote becomes a record on the import result —
  FdxImportResult.scriptNotes (TypeScript) and Fdx.ImportResult.scriptNotes
  (Swift), also on FdxDocument / Fdx.Document — not a field on Screenplay and
  not a `note` element in the stream. Wire shape, identical in both ports:

    id        the file's Id, verbatim ("107")
    author    WriterName, entity-decoded and trimmed; absent when empty
    title     Name; absent when empty ("Re: Gold Key" threads stay as text)
    category  Type — free text, not a role ("Producer", "Alt Scenes")
    color     Color verbatim (#RRRRGGGGBBBB); absent when #000000000000 or missing
    created   DateTime verbatim;  modified  DateModified verbatim
    range     { start, end } as the file states it; absent when unparseable
    anchor    { start: { element, offset }, end: { element, offset } } — where
              the range lands in script.elements; absent when past the script
    text      body paragraphs joined with "\n", blank paragraphs kept

  WriterID and RefId are not read: all 11 notes share one WriterID across two
  WriterNames, so it identifies nobody.

  WHY NOT `note` ELEMENTS. Folding each ScriptNote into the stream as a
  `[[Joe Jarvis: …]]` note would light up the Notes tab with no UI work, and
  it was measured: note 112 (9 paragraphs, 4 blank) does not survive Fountain.
  It comes back as five Action lines printed on the page, and the preserving
  save would then write them into the FDX as new paragraphs. It would also put
  authorship back under the text-prefix roster rule, which drops a one-note
  author, contrary to decision 2. Rejected on the measurement.

  WHY NOT ON Screenplay. The app keeps an .fdx as Fountain source plus the
  original bytes (ScreenplayFile.open → origin). A Screenplay field evaporates
  at the Fountain boundary, the trap IL-0016 measured. The original is always
  in hand, so the notes are a reading of it, re-derived on every open, and
  nothing flows back.

  RANGE. Offsets count the script <Content>'s paragraphs in file order, UTF-16
  units, one unit per paragraph boundary — including the End of Act paragraph
  the import absorbs. Evidence: Range 174,194 lands at +0 of the Shot
  paragraph; 18213,18219 is exactly the cue TANGLE; 25736 falls inside the
  script's single End of Act only when End of Act is counted. The other ranges
  land mid-word — stale ranges are real, so anchoring is tolerant: a position
  inside an absorbed paragraph snaps to the next element's start, a position
  exactly at the end anchors to the end of the last element, and one past the
  end leaves `anchor` absent while `range` stays.

  ROUND TRIP. The <ScriptNotes> block sits outside the script's <Content>,
  which the preserving save already copies byte for byte. The notes are read
  by a second, narrow scan — the pattern bodySpansOf already uses — so
  paragraphsOf, the collector, alignParagraphs and rewrite do not change in
  either port. Fidelity holds because the code that owns it is not touched,
  and tests prove it on the real file.

  FIXTURE. The real screenplay is NOT published (human's decision: the repo is
  public). apple/eDraftEngine/Fixtures/sample0-2.fdx is an anonymised
  derivative, made by a scratchpad script from ~/Documents/sample0-2.fdx:
  every letter of text and of content-bearing attributes becomes x/X, so each
  paragraph keeps its UTF-16 length, case, digits and punctuation and every
  Range lands where it did. WriterNames become Writer A / Writer B in order of
  first appearance, a ScriptNote Name keeps its "Re: " prefixes, the embedded
  image payload (a 431 KB artwork PNG) is emptied, and a leading XML comment
  records all this. Structure, Types, Styles, Ranges, Ids, Colors and dates are
  verbatim. Equivalence was measured against the real file with the current
  engine: 768 elements with identical types, text lengths, runs, scene numbers
  and diagnostics, and all 11 notes with identical attributes (bar WriterName
  and Name) and body lengths. One copy, beside the golden masters it pins. The exporter reads it and writes a new `scriptNotes`
  section into fdx.json: the sample's expected notes, plus small synthetic
  cases (zero-length range, End of Act snap, past-the-end, entity-encoded
  author, missing attributes, unset colour). Swift reads the .fdx by name.
  Every existing fdx.json case is left exactly as it is.

  Swift puts the port in a new Fdx/FdxScriptNotes.swift, because
  CollectedParagraph is private to Fdx.swift; Fdx.swift gains only the
  result fields and the call.
keep:
  - kind: no-new-dependency
  - kind: custom
    text: the preserving write is untouched in both ports — openFdx/rewrite/alignParagraphs/rewriteParagraph/bodySpansOf/paragraphsOf (TypeScript) and Fdx.Document.rewrite/align/rewritten/open/ParagraphCollector (Swift) have no changed lines
  - kind: custom
    text: through a no-edit save of the fixture, and through an edit to an annotated line, the whole <ScriptNotes>…</ScriptNotes> block is byte-identical — proven by tests in both ports
  - kind: custom
    text: the fixture contains no real screenplay text, no real names and no image data; WriterNames are Writer A and Writer B
  - kind: custom
    text: Screenplay, ScreenplayElement and the Fountain parser/serialiser are unchanged; notes never enter the document model or the Fountain source
  - kind: custom
    text: author comes only from WriterName; WriterID and RefId are not read; nothing infers, guesses or defaults an author
  - kind: custom
    text: the file's Color is carried verbatim as data and is never used as identity; this lock contains no display code
  - kind: custom
    text: every existing fdx.json import and export case keeps its expected output exactly — the corpus only grows
  - kind: custom
    text: both ports produce identical scriptNotes for every corpus case, the anonymised sample0-2.fdx included
