accept:
  - "The fixture imports 11 scriptNotes in file order, in both ports: author Writer A on 8 (Ids 107, 143, 152, 108, 109, 110, 111, 112), Writer B on 3 (Ids 113, 119, 137)."
  - Range 18213,18219 anchors to exactly one whole character cue (element 536, offsets 0–6); Range 174,194 anchors at offset 0 of the Shot paragraph (element 6); zero-length 25736,25736 lands in the absorbed End of Act and snaps to the next element; 970,1364 spans several elements.
  - Note 112's text keeps its four blank paragraphs as empty lines; note 137's eight paragraphs arrive in order.
  - In both ports, the <ScriptNotes> block of rewrite(script) is byte-identical to the fixture's, with no edit and after editing an annotated line.
  - Every pre-existing fdx.json case's expected output is unchanged; the new scriptNotes section is reproduced exactly by Swift.
  - All existing TypeScript package tests and Swift engine tests stay green, 0 failures.
