status: verified
utterance: "Draft IL-0021 on the narrow scope: restore the fold on the mark() side only, invert the bad test to assert the folded position, fix the unscaled caret band height. Leave format bar / find / ghost for a separate IL-0022 after the visual proof passes — one symptom family per lock, so my on-screen test can actually tell us what worked."
goal: In two-page mode the reveal highlight is painted in the text view's spread coordinates, so a sidebar reveal lands on the line it named, on the correct page, at the correct scale; and the caret band that drives viewport-follow is measured at the same scale as the coordinates it is compared against. The two genuine IL-0020 fixes (anchoredLine/scrollBack unfolding, caretContentLine's folded top) are preserved unchanged. Format bar, find-bar and ghost overlay stay fold-blind, deferred to IL-0022.
interpretation: |
  IL-0020 assumed the text view's own coordinate space is the unfolded TextKit
  column. It is not: ArrangedTextView.draw paints every line fragment through
  fold.spreadPoint, characterIndexForInsertion unfolds an incoming view-space
  point, and firstRect folds before leaving for the window. The view's space
  IS the spread. So an overlay hosted by the text view — the reveal highlight,
  a subview whose frame is in its superview's coordinates — must be given the
  FOLDED rectangle, which is what IL-0020 removed.

  Three edits, one symptom family:
  1. Give mark() ownership of the conversion into the space of the view it
     draws into: widen in TextKit coordinates as now, then fold. Factor the
     V-to-spread step out of canvasRect so both callers share one boundary.
     reveal() keeps passing the unfolded rect, so scroll(revealing:) — which
     folds inside canvasY — is untouched.
  2. Rewrite testSpreadRevealKeepsHighlightInTextViewCoordinates, which asserts
     the unfolded position and would fail against correct code. The replacement
     paginates past two sheets and asserts the mark's midX and midY against
     fold.spreadRect of the same line, so it proves the page and the column,
     not only the scale.
  3. caretContentLine composes a canvas-space band from a folded top and an
     UNSCALED TextKit height; take both from canvasRect so the band is one
     rectangle's worth of one coordinate system. Single mode is unaffected —
     fold is nil, scale is 1.

  Out of scope by the human's instruction: SelectionFormatBar.reposition,
  FindBarClient.rects, GhostTextOverlay.updateFrame and screenOffsetForTesting
  are all fold-blind and all stay that way until IL-0022, so the on-screen test
  attributes what it sees to one change.
