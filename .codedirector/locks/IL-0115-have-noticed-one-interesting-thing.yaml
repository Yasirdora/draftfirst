verifyCommand: "node -e 'const fs=require(\"fs\");const lic=fs.readFileSync(\"LICENSE\",\"utf8\");const rd=fs.readFileSync(\"README.md\",\"utf8\");const rfc=fs.readFileSync(\"docs/RFC-DRAFT-FORMAT.md\",\"utf8\");const pk=JSON.parse(fs.readFileSync(\"packages/edraft/package.json\",\"utf8\"));const lk=JSON.parse(fs.readFileSync(\"package-lock.json\",\"utf8\"));const checks={licenseNotice:lic.startsWith(\"Copyright © 2026 eDraft. All rights reserved.\"),licenseKeepsHistory:/MIT License/.test(lic)&&/26 September 2026/.test(lic),readmeNoMitBadge:!/license-MIT/.test(rd),readmeNoMitLine:!/MIT ©/.test(rd)&&!/License: \\[MIT\\]/.test(rd),packageField:pk.license===\"UNLICENSED\",lockfileField:lk.packages[\"packages/edraft\"].license===\"UNLICENSED\",rfcAmended:/Amended 2026-09-26/.test(rfc)};const bad=Object.entries(checks).filter(([k,v])=>!v);if(bad.length){console.error(\"licence checks failed:\",bad.map(([k])=>k).join(\", \"));process.exit(1)}console.log(\"licence checks:\",Object.keys(checks).length,\"passed\")' && npm run --silent package:verify"
