goal: "From 2026-09-26 the repository is Copyright © 2026 eDraft, all rights reserved, not MIT: LICENSE, README, the @edraft/core licence field and its lockfile entry, and RFC-DRAFT-FORMAT D3 say so, and say that copies published earlier under MIT keep MIT. The website's pricing change follows in its own lock."
interpretation: |
  THE OWNER'S DECISIONS (2026-09-26, asked and answered in this session):
  - eDraft is free for education and research and paid for professional
    work; prices are "to be announced", one-time purchase, and the rule
    covers everything, the browser editor included. That is the website's
    change — the NEXT lock. The website waits for this one.
  - The code licence: "Replace MIT: all rights reserved". The copyright
    owner is eDraft, a registered company. The GitHub account mirdora-dev is
    the owner's second account, so every commit is the owner's to relicense.

  WHY THIS LOCK COMES FIRST. The repository is MIT (LICENSE, README,
  @edraft/core). MIT lets anyone use, change and sell the code, commercial
  work included, so the website could not truthfully say professional use
  is paid while the code says it is free for any use.

  WHAT CHANGES (licence statements only — no code, no app, no website):
  - LICENSE: the MIT text is replaced by a short all-rights-reserved notice
    for eDraft, which also says: versions published before 26 September 2026
    were released under the MIT License and copies obtained under it keep
    it; the eDraft apps and website are offered under their own terms.
    Plain words, not a lawyer's — the owner is advised to have it checked.
  - README.md: the MIT badge goes; "License: MIT" and "MIT © 2026 Yasir
    Dora." become all-rights-reserved lines naming eDraft.
  - packages/edraft/package.json: "license": "MIT" → "UNLICENSED" (npm's
    word for "not licensed for others to use"); package-lock.json's matching
    workspace entry the same — the only lockfile line that changes.
  - docs/RFC-DRAFT-FORMAT.md D3 ("the engine is MIT"): a dated amendment
    that the engine is no longer MIT from this date; whether the .draft
    specification stays an open standard is left as the owner's open
    decision, not decided here.
  apple/macOS/Info.plist already reads "Copyright © 2026 eDraft. All rights
  reserved." — unchanged (and budgeted by the active IL-0114).

  FACTS BEHIND IT. @edraft/core has never been published on npm (404,
  2026-09-26), but the GitHub repository is public, so what is already in
  its history stays MIT for anyone who has it. Authors: Yasirdora and
  mirdora-dev (the owner's accounts) only.

  NOT IN THIS LOCK — FOR THE OWNER'S WORD: README/CONTRIBUTING invite
  outside contributions (under all rights reserved an outside contribution
  needs a written contributor agreement); RELEASING.md plans a public npm
  release ("private": true would block it); the .draft specification's
  openness; whether the public GitHub repository should become private.
