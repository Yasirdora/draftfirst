utterance: ChatGPT's M1 identity layer has since landed (348a38d) — every element now carries a DraftElementID, so where your omission record is an index span, you may note in the RFC's Open Questions that migrating it to ids is a later stage. Do not do that migration in this lock.
goal: docs/RFC-DRAFT-PRODUCTION.md §13 carries a numbered open question recording that the engine's omission record ships as a span of element indices while §7.3 addresses its span by DraftElementID, and that migrating it onto M1's identities is a later stage; §7.3 itself points a reader at that question, so the section cannot be read as describing the shipped engine. The RFC only; no engine, app or fixture file is touched and no migration is built.
interpretation: |
  MEASURED FIRST, and most of this is already written down. The note the
  request asks for exists in three places at HEAD (348a38d):

    - packages/edraft/src/types.ts, on `Omission`: "§7.3 addresses its span
      by DraftElementID; the legacy omission API still uses element indices;
      migration to persistent identity is a separate production milestone."
    - apple/eDraftEngine/Sources/EDraftEngine/Model/Types.swift, the same
      note on the Swift `Omission`.
    - The RFC itself, §13 Q12, which closes: "No omission-by-ID migration or
      application `.draft` save wiring is implied."

  Both model comments are ChatGPT's, written with M1 (IL-0073). So this lock
  does not repeat them. What is missing is a *tracked* question: Q12 is
  marked "Resolved for M1" and mentions the migration only as something M1
  does not imply. A reader scanning §13 for work still to do does not find
  it, and a reader of §7.3 alone sees `elements` described as
  DraftElementIDs with nothing saying the shipped engine uses indices.

  WHAT IT ADDS. One row, Q13, in §13's table, recording:

    - §7.3 addresses an omission's span by DraftElementID. The engine that
      shipped in cdcc477 (IL-0071) records `Screenplay.omissions` as
      `{ start, end }` over the elements array, because no element carried
      an identity when it was written.
    - M1 (348a38d, IL-0073) gave every element a `DraftElementID`, in both
      ports' `ScreenplayElement`, so the migration is now possible.
    - The two representations are separate today, measured: `.draft`'s
      production.json carries §7.3's record by id (`id`, `number`,
      `elements`, `issued` — IL-0052), while the engine's index span is
      FDX-facing and derived at read. script.json's members are
      `titlePage`, `elements`, `nextId`: the index span is never written to
      a file.
    - Why it is open rather than done: it changes the model, both ports'
      fixtures and every consumer that reads a span, and an index span is
      invalidated by an edit that inserts or deletes elements before it,
      so the migration wants its own lock and its own proofs.

  AND THE POINTER IN §7.3 (approved 2026-09-21). §7.3's table says an
  omission's `elements` are DraftElementIDs, which is the contract but not
  the shipped engine. One sentence after its FDX paragraph — where the
  section already describes what the engine does — records that the engine
  keeps the span as element indices, that `.draft`'s production.json
  carries the id-shaped record, and that Q13 is where the migration is
  tracked. Nothing in the table or the rules changes: the contract is not
  being weakened to match the code, only cross-referenced.

  WHAT IT DOES NOT DO. No migration. No engine, app, surface, fixture or
  test file is touched — every one of them is denied. §7.3's table, its
  rendering rule, its Blocked rule and every other section stand unchanged.
