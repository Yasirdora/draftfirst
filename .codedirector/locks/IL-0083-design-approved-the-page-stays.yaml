utterance: "Design B, approved: the page stays pure — the chevron moves out of the text column into the left gutter, revealed on hover, so the script itself is never touched by chrome. The faded ink stays as the glanceable signal of what was cut."
goal: On hover, the omitted card's chevron appears in the left gutter beside the card's line — outside the text column entirely — in both states and both layouts. The column carries nothing but the faded word OMITTED.
interpretation: |
  THE DIRECTION. The human picked design B from a five-option mock sheet:
  the chevron leaves the text column and lives in the left gutter, the
  way a margin note does — the page stays a page, the UI lives in the
  margin. IL-0082 put the chevron beside the word; this supersedes only
  its horizontal anchor. Everything else from IL-0080/IL-0082 stands:
  faded ink, hover reveal, chevron stays while open, tooltip and
  VoiceOver, column-wide overlay frame for hover and hit-testing.

  THE CHANGE, IN THE CODE. The overlay's frame is unchanged (the column,
  for hover tracking). Only the chevron's x changes: from
  `glyphMaxX + gap` to `-(width + gutter gap)` — just left of the text
  column, in the page's generous left margin (a screenplay's 1.5-inch
  margin has thirty points to spare). NSView does not clip subviews, and
  neither the legacy text view nor the PageSheet text views set
  clipsToBounds — verified before drafting — so the gutter is reachable
  from a subview of the text view. hitTest and the cursor rect follow
  the chevron's frame, which is already how they work. The head anchor's
  vertical band is unchanged: the chevron rides the card's own line.

  PROOF. Tests: the chevron's trailing edge sits left of the column's
  leading edge and its frame stays on the page (left of zero by no more
  than the margin allows); it rides the card's line in both states; the
  IL-0079 column-frame and IL-0081 caret tests stay green.
