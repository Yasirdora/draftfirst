    source: user
    confirmed: true
  - text: Grid is 3 or 4 columns on smaller windows and up to 6 on larger ones, filling the row.
    source: user
    confirmed: true
  - text: Double-click opens the sheet in Single. A single click does not leave Grid.
    source: user
    confirmed: true
