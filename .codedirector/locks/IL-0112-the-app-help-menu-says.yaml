schemaVersion: 1
id: IL-0112
status: verified
utterance: "The app's Help menu says \"help isn't available for eDraft\" — the app has no Apple Help Book registered. Kimi builds the generator half: an offline Apple Help Book generated from the same articles.ts the website uses, so web help and in-app help can never drift. One source, three outputs: website, in-app book, Help menu search. The Xcode/Info.plist wiring is a separate lock (Claude)."
goal: "A generator turns src/lib/help/articles.ts into a complete offline Apple Help Book at build/help-book/eDraft.help (gitignored): an access page, one page per topic, one page per article, a shared stylesheet, the bundle Info.plist, and a hiutil search index. Every page links its online twin at edraft.xyz/help. Pure generator + tests; no site, app, or content change. articles.ts is untouched."
interpretation: |
  THE HOLE. macOS shows "Help isn't available for eDraft" because the app
  bundle carries no registered help book. The content already exists as data
  (articles.ts was written for this: "The same data will later generate the
  Apple Help Book"). This lock builds the generator only; registering the
  book in the app's Info.plist and adding it to the Xcode bundle is the
  follow-up wiring lock.

  THE BOOK (Apple Help Programming Guide layout):
  - build/help-book/eDraft.help/Contents/Info.plist — CFBundleIdentifier
    xyz.edraft.help, HPDBookTitle "eDraft Help", HPDBookAccessPath
    index.html, HPDBookIndexPath search.helpindex.
  - Contents/Resources/en.lproj/index.html — the access page: title, the
    eight topics with their descriptions, a "view online" link.
  - topic/<id>.html per category; article/<slug>.html per article with
    breadcrumb, body blocks (h/p/list/steps/table/tip/note), See also, and
    its online twin link.
  - shrd/help.css — Apple help voice: system font, 17px body, semibold
    titles, blue only for links.
  - search.helpindex built by /usr/bin/hiutil when present (skipped with a
    printed note where it is not), so Help menu search works once wired.

  ESCAPING IS THE RISK. Article text contains &, <, >, ⌘, curly quotes.
  helpbook.ts escapes every text node; the test pins it.

  TESTS — src/lib/help/helpbook.test.ts (new):
  - every article and every category produces a page; the access page links
    all 8 topics; every See-also/related slug resolves to a real page;
  - escaping: a text with &, <, >, " renders escaped;
  - the bundle Info.plist carries identifier, title, access path, index path;
  - every internal href points at a file the book contains.
  RUNNER. scripts/build-help-book.mjs compiles the TS entry with the repo's
  own esbuild (already a devDependency — no new dependency) into a temp file
  and runs it; npm script "build:help-book" added to package.json.
