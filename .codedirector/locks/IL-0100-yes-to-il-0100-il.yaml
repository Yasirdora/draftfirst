  - "SAVE AND REOPEN: open → edit → save → reopen through ScreenplayFile and EditorState keeps every act break in the file and in the editor — fails at 3446dee, passes after."
  - "WRITTEN FROM THE MODEL: a canonical card the save cannot pair is written as New Act, not centred General; File ▸ Export ▸ Final Draft writes New Act — both fail at 3446dee, pass after."
  - "FOUNTAIN: a .fountain file's act cards open as act breaks and its bytes save unchanged — fails at 3446dee, passes after."
  - "NAMED: a custom card opens centred, keeps its New Act when the save pairs it, and is written as centred General text when the save writes it from the model — pinned, and stated in RFC-ACT-BREAK §3."
  - "PARITY: the act-cards corpus case (parse, serialise, paginate) is produced by the TypeScript engine and reproduced by the Swift engine; the corpus is fresh; existing expectations do not move."
  - "NO REGRESSION: TS package, Swift engine, EDraftCore and Mac surface suites green; macOS Debug build succeeds; a no-edit save of the fixture is byte for byte."
