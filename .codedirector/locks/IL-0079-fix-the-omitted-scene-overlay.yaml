schemaVersion: 1
id: IL-0079
status: verified
utterance: "Fix the omitted-scene overlay frame — your IL-0076 code, found by your own showcase screenshot. The fix: frame the region to the line's full text-column width — the line fragment rect for the card line at the text block's width, not the glyph bounding rect — in both the legacy container and the PageSheet paths, in grid as well if the overlay draws there. The pill and disclosure then sit at the column's right edge like the note markers do."
goal: The omitted-scene overlay is framed to the text column, not to the glyphs of the card, in both the single-container and the PageSheet layouts — so the pill and the disclosure sit at the column's right edge, clear of the card's own words and inside the page.
interpretation: |
  THE DEFECT, READ IN THE CODE. `ScriptSurface.placeOmittedRegions` frames
  each OmittedSceneRegionView to `sheetRect(for: region.range)`, which ends
  in `ScriptLayout.boundingRect(of:in:)`. That helper does widen a rect to
  the container — but only through `widened(_:toAtLeast:)`, which fires when
  `rect.width < 1`: an empty line. A line with glyphs on it returns
  `NSLayoutManager.boundingRect(forGlyphRange:)`, which hugs the glyphs. A
  collapsed card's glyphs are the word "OMITTED", so the overlay is that
  wide; the view trailing-aligns its controls to `bounds.maxX`, and a pill
  plus a disclosure wider than one word run leftward over the word and off
  the page into the gutter. Seen in the shipped build (28aaf8d) and in the
  showcase capture.

  THE FIX. A column-width rect beside the glyph one, not a change to the
  glyph one — `boundingRect` is what reveals, find and the note wash rely
  on, and they want the glyphs.

    - `ScriptLayout.sheetColumnRect(of:in:)`: the line fragment rects of
      the lines a range touches — `lineFragmentRect(forGlyphAt:)`, which
      spans the text container, i.e. the column — unioned, clipped to the
      part of the range this view's container draws (as
      `sheetBoundingRect` already clips), in the view's own coordinates.
      The TextKit 2 branch already answers with full-width layout-fragment
      frames, so it is reused unchanged.
    - `placeOmittedRegions` frames the overlay with it. One helper serves
      both layouts: the single container is one view, and each PageSheet
      is its own view with its own container, which the clip handles.
    - OmittedSceneRegionView keeps trailing-aligning its controls; with a
      column-wide frame, "trailing" is the column's right edge. The note
      marker sits outside the column in the margin, so the two do not meet.
    - Grid: measured before deciding. If a card's miniature snapshots the
      sheet with its subviews, the overlay is in it and the same frame
      fixes it; if the miniature paints glyphs only, the overlay does not
      draw there and grid needs nothing. The report says which.

  PROOF. A test, in both layout paths, that a collapsed card's overlay is
  as wide as the text column and wider than the card's glyphs, and that
  neither control's frame intersects the card's glyph rect. Then a reshoot
  from a *copy* of the showcase's demo scene, with a build proven to carry
  the fix, compared against the published example — scene 3 numbered 3.
  The reshot image is handed over for comparison; it is not written into
  the showcase folder.
