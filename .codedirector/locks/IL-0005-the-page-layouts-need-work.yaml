  - packages/**
  - apple/EDraftCore/**
change: Fast fixed 4-up grid without snapshots; two-page fits the window and maps Navigator reveals through the fold.
verifyCommand: swift test --package-path apple/EDraftMacSurface --filter DiscreteSheetsTests
budget:
  files:
    - apple/EDraftMacSurface/Sources/EDraftMacSurface/PageCanvasView.swift
    - apple/EDraftMacSurface/Sources/EDraftMacSurface/ScriptSurface.swift
    - apple/EDraftMacSurface/Tests/EDraftMacSurfaceTests/DiscreteSheetsTests.swift
  symbols: []
  maxFiles: 3
  maxLines: 2500
accept: []
assumptions:
  - text: Grid is always four across and does not snapshot the script. Speed over a live thumbnail of every sheet.
    source: user
    confirmed: true
