schemaVersion: 1
id: IL-0005
status: verified
utterance: "the page layouts need work. grid is slow to open — i'd rather have a fixed 4 pages per row and fast than responsive and slow. two-page should scale with the window, right now it doesn't. grid is an overview only: no caret, no editing there. but two-page should be fully editable and navigable, like Pages does it. also clicking a scene in the side panel or a character in the cast panel lands the highlight in the wrong place in two-page — in grid it's enough to highlight the right page."
goal: "Grid is a fast 4-up overview: no snapshots, no caret, no editing; a scene or character click highlights that sheet. Two-page fits the window, stays editable, and scene or character clicks land the highlight on the right line."
interpretation: Drop the grid snapshots and always use four sheets across so opening Grid is instant. Grid is a map — no caret, no typing; a Navigator click lights the sheet that holds that scene or character. Two-page sizes the opening to the visible window and stays a writing surface; a Navigator click maps through the fold so the highlight sits on the right line.
keep:
  - kind: no-new-dependency
  - kind: custom
    text: Single arrangement and Continuous are unchanged
  - kind: custom
    text: View menu zoom and canvas zoom remain
  - kind: custom
    text: which line begins which page does not change
