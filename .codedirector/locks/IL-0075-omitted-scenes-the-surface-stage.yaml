id: IL-0075
status: verified
utterance: "Omitted scenes: the surface stage. Done means: an omitted span renders greyed/struck-through (Final Draft's visual language — muted ink, not hidden), is not editable (clicking into it does not place a caret), and the Navigator marks it. Pagination: measure what Final Draft 13.4 does with the fixture first — does the omitted scene count toward page numbers? — follow it, and report what you measured. Edits outside the span stay exactly as today; the IL-0071 save behavior (file's bytes win, FDX_REWRITE_OMITTED_SCENE_KEPT) must keep passing untouched."
goal: "An omitted scene reads as omitted in the Mac app: the span comes off the origin FDX onto the document model as DraftElementIDs, renders in muted ink with a strike and is never hidden, refuses the caret and refuses edits, is left out of pagination the way Final Draft 13.4 leaves it out (measured on the fixture), and yields one Navigator row marked omitted instead of a duplicate scene 21 — with every edit outside the span, and IL-0071's save behaviour, exactly as today."
interpretation: |
  MEASURED FIRST, as asked. Final Draft 13.4 wrote finaldraft-sample02.fdx,
  so the file itself says what Final Draft did with its omitted scene:

    - The Scene Heading that holds the block — the OMITTED card, Number 21 —
      records `Length="0" Page="17"`. It sits on page 17 and takes no
      measurable height.
    - The scene nested inside <OmittedScene> records `Page="1"`. The script
      runs to page 25 and its 35 live scenes are monotonic from 1 to 25, so
      `Page="1"` is not a place in this script: that scene was never
      paginated in situ.

  THE RULE THAT FOLLOWS: an omitted scene does not count toward page
  numbers. The card holds the scene's place at zero length; the body is out
  of the flow. This lock follows that, and the report will carry the
  numbers.

  HOW THE MARKER REACHES THE SURFACE — the design decision the human asked
  to see before any code.

  The span does not survive the open path today: ScreenplayFile.open is
  `Fountain.serialise(shouted(Fdx.parse(text).script))` (line 63), and
  Fountain has no spelling for an omission, so `script.omissions` is
  dropped at that boundary. Four ways across, and why this one:

    1. CHOSEN — off the origin, on the seam that already exists. The app
       target already hands EDraftCore the original FDX:
       `editor.attachImportedNotes(from: origin)` (ScreenplayDocument.swift
       line 82), and EditorState already calls `Fdx.parse(origin)` there
       (line 77) to attach Final Draft's notes. The omission comes off that
       same parse — no second read of the file, no change to
       ScreenplayFile.open's contract, and no edit to the denied app
       target. The engine's index span is converted, as it lands, into
       DraftElementIDs (M1, IL-0073), which is what the surface then
       renders and locks by. Ids survive edits that move elements; indices
       do not, which is why the surface must not hold indices.
    2. Rejected — a Fountain spelling for omissions. It would change what
       eDraft writes into users' files, and the engine and packages are
       denied. The RFC's §7.3 carrier is `.draft`'s production.json, not
       Fountain.
    3. Rejected — re-deriving in the surface at render time. It duplicates
       the engine's rule in a second place and re-parses a 750 KB file on a
       draw path.
    4. Rejected — inferring the span from an OMITTED card's text. Fragile
       (it reads letters, not structure) and simply wrong for a document
       eDraft made itself.

  WHAT IT BUILDS:

    - EDraftCore holds the omission as `Set<DraftElementID>` plus the
      ordered spans, attached at open from the origin, and answers "is this
      element omitted" for the surface and the Navigator.
    - Pagination: the model fed to `Paginator.paginate` (ScreenplayExporter
      line 107, EditorState line 1651) leaves omitted elements out, so page
      numbers match Final Draft's. The engine paginator is untouched — it
      is denied, and it does not need to know.
    - The Mac surface renders an omitted element in muted ink with a strike
      through it (ScriptLayout's attributes), never hidden: the writer must
      see what was cut.
    - The caret refuses the span: a click inside it does not land, and
      `shouldChangeTextIn` refuses edits that fall in it. Selection across
      it is allowed — a writer may still copy what was omitted.
    - The Navigator stops showing scene 21 twice: the omitted heading no
      longer yields a row of its own, and the card's row carries
      `omitted: true`.

  WHAT IT DOES NOT BUILD: any way to omit or restore a scene from the app —
  that is Production Mode, and §7.3 blocks Omit in `development` anyway.
  No engine change. No .draft wiring. No migration of the engine's span to
  ids (RFC §13 Q13 tracks that).
