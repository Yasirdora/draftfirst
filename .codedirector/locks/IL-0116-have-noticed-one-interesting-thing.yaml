utterance: I have noticed one interesting thing, it seems edraft is marketed as free, it is free for education and research not for commercial work I think, chatgpt misunderstood me and changed it to completely free, can you please fix it, price TBA maybe 9.99 for creators and 99.99 for studios what do you think 0 for educational and research
goal: "The website no longer says eDraft is free for everyone: the features page says it is free for education and research, and that professional work needs a one-time licence with the price announced at launch, covering the Mac and iPhone apps and the browser editor."
interpretation: |
  THE OWNER'S DECISIONS (2026-09-26): free for education and research;
  paid for professional work; prices "to be announced" (no numbers on the
  site); a one-time purchase; the rule covers everything, the browser editor
  included. The code licence change came first — IL-0115 (f953cd9), © 2026
  eDraft, all rights reserved.

  WHAT THE SITE SAYS TODAY. One direct price claim: the features page's
  comparison table, "Price: Free". Everything else still holds:
  - "no account, no subscription" (features intro) — true: one-time price;
  - "No account required" (home page description) — true;
  - "eDraft does not hold your pages hostage behind a paid tier" (formats)
    — true while every version has the same features and no watermark;
  - the footer already reads "© {year} eDraft"; the call-to-action band says
    only "Start writing".

  WHAT CHANGES — one file, src/routes/features/+page.svelte:
  1. The comparison table's Price row for eDraft: "Free" becomes
     "Free for education and research. Professional: one-time, price at
     launch."
  2. The comparison intro: "priced, gated, and cloud-bound" becomes "gated
     and cloud-bound" — eDraft is priced now too, so the word no longer
     sets it apart.
  3. One paragraph under the table (the existing compare-intro style, no new
     CSS): "eDraft is free for education and research. Professional work,
     for writers and for studios, needs a licence: a one-time purchase, with
     the price announced at launch. The same rule covers the Mac and iPhone
     apps and eDraft in your browser."

  NOT IN THIS LOCK — FOR THE OWNER'S WORD: terms of use. The new LICENSE
  says the apps and website are "offered under their own terms", and no
  terms page exists yet; "education", "research" and "professional" need a
  written definition there before launch. Also later: a help-center article
  on pricing; the App Store listing (docs/APP-STORE-READINESS.md still calls
  the business model an open question).
