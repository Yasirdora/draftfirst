verifyCommand: "node -e 'const s=require(\"fs\").readFileSync(\"src/routes/features/+page.svelte\",\"utf8\");const checks={priceRow:s.includes(\"edraft: \\x27Free for education and research. Professional: one-time, price at launch.\\x27\"),noPlainFree:!s.includes(\"edraft: \\x27Free\\x27\"),intro:s.includes(\"gated and cloud-bound\")&&!s.includes(\"priced, gated\"),note:s.includes(\"eDraft is free for education and research. Professional work, for writers and for studios, needs a licence\")&&s.includes(\"eDraft in your browser.\")};const bad=Object.entries(checks).filter(([k,v])=>!v);if(bad.length){console.error(\"pricing copy checks failed:\",bad.map(([k])=>k).join(\", \"));process.exit(1)}console.log(\"pricing copy checks:\",Object.keys(checks).length,\"passed\")' && npm run --silent check"
