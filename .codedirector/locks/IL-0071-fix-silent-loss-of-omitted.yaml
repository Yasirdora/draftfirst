  - "PARSE: the 8 nested paragraphs become elements with their types, runs and TagNumbers; the omission record names a contiguous span starting at the scene heading and carries the scene number as locked."
  - "MODEL: the model says which elements are omitted — the span is queryable without re-reading the file."
  - "EXPORT: a fresh writeFdx of a parsed file writes <OmittedScene> back, nested inside the OMITTED card paragraph, with the body's types and TagNumbers."
  - "STABLE: import to export to import gives the same document, omission included."
  - "PRESERVING SAVE: a no-edit save of both Final Draft fixtures is byte-identical, through the file path and through Fountain; the wrapper and its ids keep their bytes."
  - "RANGE SPACE: sample02's 8 notes anchored at or before the omitted scene keep exactly the anchors they have today; the 3 after it move by the body's element count, and by nothing else."
  - "PORTS: TypeScript and Swift read every omission case to the same document and write identical bytes."
  - "SUITES: npm test green, swift test for apple/eDraftEngine green, swift test for apple/EDraftCore green (350, untouched)."
