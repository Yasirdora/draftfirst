schemaVersion: 1
id: IL-0071
status: verified
utterance: Fix silent loss of omitted scenes in FDX. Parse <OmittedScene> into a first-class, reversible representation (per docs/RFC-DRAFT-PRODUCTION.md §7.3 the body stays in the script model and the omission is a record over a contiguous element span starting at a scene heading); the editor model must expose that these elements are omitted; FDX export writes the <OmittedScene> wrapper back with the original paragraph ids and TagNumbers preserved. Unknown nested structure follows the existing embedded-blocks rule. Export of a parsed file keeps the omission; import→export→import is stable. Rendering of omitted scenes in the editor is a later surface stage — out of scope here.
goal: "An omitted scene survives an FDX open and save in both engines: the nested <OmittedScene> body is read into script.elements as real elements, the omission is a record over a contiguous element span starting at a scene heading (RFC-DRAFT-PRODUCTION §7.3), the model says which elements are omitted, a fresh export writes the <OmittedScene> wrapper back around them with their types and TagNumbers, the byte-preserving save stays byte-identical, and import→export→import is stable — byte-identical across TypeScript and Swift, with no surface, UI or app file touched."
interpretation: |
  REPRODUCED FIRST, and it is worse than the brief says. Measured on
  apple/eDraftEngine/Fixtures/finaldraft-sample02.fdx at HEAD:

    - The file's one <OmittedScene> is NOT a sibling of the script's
      paragraphs. It is nested INSIDE a visible Scene Heading paragraph
      (Number="21", text "Xxxxxxx" — the anonymised OMITTED card), and it
      holds 8 paragraphs: Scene Heading, 4x Action, Transition, Outline 1,
      Summary; 8 paragraph ids and 5 TagNumbers.
    - parseFdx does not mis-type the heading. It drops the whole nested
      block: every <Text> run inside it that is unique in the file is
      absent from script.elements (the heading "Ext. Xx xxx xxxxxx xxxx -
      dusk" is not in the model at all). Checked against uniqueness,
      because the anonymised corpus repeats short runs.
    - No omit marker anywhere in the model ("omit", "Omit", "omitted",
      "OmittedScene" all absent from the serialised script), and zero
      diagnostics.
    - writeFdx therefore does not resurrect the scene as live paragraphs —
      it DELETES it. No <OmittedScene>, no TagNumber="317", none of the 8
      ids. What survives is the OMITTED card with nothing behind it.
    - The byte-preserving save is the only shield, and it holds: a no-edit
      openFdx().rewrite() of sample02 is byte-identical and keeps the
      wrapper.

  WHY IT HAPPENS. In the scanner, an embedded block inside a paragraph
  records its place (EMBEDDED_BLOCKS, two Range units) and is then skipped
  whole as metadata. <DualDialogue> escapes that by also recording a source
  span, which dualDialogueOf re-parses as a script of its own.
  <OmittedScene> records no span, so its paragraphs are never read.

  WHAT THIS LOCK BUILDS, both ports, TypeScript first and Swift pinned to
  it by the shared conformance fixture:

    1. THE BODY IS READ. omittedSceneOf mirrors dualDialogueOf: the block's
       source span is re-parsed as a script of its own and its paragraphs
       become real elements, with their types, runs and TagNumbers.
    2. THE OMISSION IS A RECORD (§7.3). Screenplay gains `omissions` — a
       contiguous element span starting at a scene heading, carrying the
       scene `number` as locked. The elements remain in the script; the
       record says which are omitted, and removing the record restores
       them. This is §7.3's shape; §7.3's `elements` are DraftElementIDs,
       which this model has no equivalent for (ids are .draft script.json,
       FORMAT §6.1), so the span is by element index — named here so the
       mapping is a decision, not an accident.
    3. EXPORT WRAPS IT BACK. A fresh writeFdx writes <OmittedScene> around
       the span's paragraphs, inside the OMITTED card paragraph, the way
       Final Draft nests it. The preserving save keeps the original bytes,
       ids included, as it does today.
    4. UNKNOWN NESTED STRUCTURE still follows the embedded-blocks rule:
       anything inside the block that is not a paragraph this engine reads
       stays metadata, skipped whole, and the preserving save keeps its
       bytes.

  THE RANGE SPACE DOES NOT MOVE. A ScriptNote Range counts the wrapper as
  one paragraph plus two units for its block (IL-0031, IL-0033, and the
  Final Draft probe's fact 5). That counting is what keeps every note on
  its words through a Final Draft round trip, so it is unchanged here: the
  body elements are added to script.elements without becoming paragraphs
  in the Range layout.

  ONE EXISTING EXPECTATION MOVES, AND IT CANNOT NOT MOVE. The brief asks
  that every existing corpus expectation stay unchanged. Measured: the
  OMITTED card is element 533 of 780 in sample02, and 3 of that file's 11
  ScriptNotes are anchored after it. Their anchors are element indices, so
  reading the omitted body into the model shifts those 3 by the number of
  body elements. fdx.json's `finaldraft-sample02` scriptNotes case records
  them, so that case changes. Everything else stays byte-identical. This is
  the price of the body existing at all; the alternative — keeping the body
  out of script.elements — is what §7.3 forbids.

  NOT IN THIS LOCK. Rendering the omission in the editor is the surface
  stage and is out of scope (the user said so). Every surface, UI and app
  package is denied. Nothing writes to production.json here: this lock is
  the FDX carrier and the screenplay model, not the .draft production part.

  PARAGRAPH IDS, HONESTLY. "Original paragraph ids preserved" holds for the
  byte-preserving save, which keeps the file's bytes. A fresh writeFdx has
  never written paragraph id attributes for any body paragraph — the model
  has no element id to write — so the wrapper it writes carries types, text
  and TagNumbers, and no ids. Named rather than quietly skipped.

  FIXTURES: the anonymised corpus only; no real script text.
