utterance: '1) YES — the save-damage fix jumps the queue, effective immediately. Your proposed order stands: save-damage → counting → dual dialogue → Range maintenance → role → write-into-ScriptNotes. 2) YES — the rebase onto sample02.fdx waits until the save fix lands; rebasing now would just re-strip the tags on my first edit. 3) Migrate nothing — "test" was a test, and the 8 changes are test typing and save artifacts, not script work. One requirement for the save-damage lock: the conformance suite must gain anonymized copies of PRISTINE Final Draft-written files (sample02, sample01) so the byte-identical proof runs against files that still carry their tags — the IL-0025 blind spot must become impossible.'
goal: A save never changes a paragraph the writer did not edit — not in the engine, and not through the app's Fountain open-and-save path. Proven byte for byte on anonymised copies of two files Final Draft itself wrote, which still carry their production tags, revision marks and Final Draft's own run splits, and which fail on today's code; and guarded so a fixture that cannot fail is itself a failing test.
interpretation: |
  Measured 2026-09-17 at 20b25f2 on ~/Documents/sample02.fdx (Final Draft's
  own save) and Final Draft's backup 20260909090409sample01.fdx. The human
  verified the engine-level loss independently (8 tags, 706 bytes).

  TWO LEAKS, BOTH IN THE SAVE'S "DID THIS PARAGRAPH CHANGE?" GATE.

  1. ENGINE. rewriteParagraph (TypeScript) / rewritten (Swift) compare the
     file's RAW runs with the element's NORMALISED runs. Final Draft splits
     runs the model merges ("HOME LIBRARY, " + "CASALINDA", same tag, one
     with AdornmentStyle="-1"), so 8 untouched headings read as edited and are
     rewritten — tags, AdornmentStyle and the AllCaps style lost. Prototyped:
     comparing normalised with normalised makes a no-edit engine save
     byte-identical on both files.

  2. APP PATH. The app edits Fountain. Fountain carries Bold, Italic,
     Underline and Strikeout only — tightened off whitespace — and nothing
     else: no TagNumber, RevisionID, highlight, AllCaps, HiddenText. It also
     re-reads some paragraphs differently, measured with no edit at all: an
     emphasised scene heading becomes Action (`… (N1) #2#`, `.KITCHEN …`),
     an italic "(beat)" after dialogue becomes Dialogue, a paragraph with a
     line break is split in two, a trailing space is trimmed. The gate calls
     all of it an edit. Today: sample02 loses 400 of 407 tags, one scene's
     SceneProperties, 21 KB. These are the Sep 12 "save artifacts" (#2#,
     (beat), the trimmed space) — reproduced now with no edit.

  THE FIX, ONE PRINCIPLE: an unedited paragraph is written back untouched.
  "Unedited" is judged in the representation the caller edits, not the
  file's:

    - The engine gate compares normalised runs with normalised runs.
    - rewrite gains an optional `unedited` screenplay — the caller's own
      reading of this file before any edit (TypeScript: an options object;
      Swift: a parameter). The engine corresponds each file paragraph with
      the unedited element(s) it became — one to one, or one paragraph to the
      consecutive elements it was split into at its line breaks, or by
      position inside an otherwise-aligned gap (the #2# heading) — aligns the
      incoming screenplay against the unedited one by whole-element equality,
      and writes every paragraph whose unedited element(s) come back unchanged
      as its original bytes, with no further gate. Everything else takes
      today's path. Where no correspondence can be established, that region
      takes today's path too, and the TypeScript result reports it
      (FDX_REWRITE_UNEDITED_UNALIGNED).
    - ScreenplayFile.encode passes it: `Fountain.parse(open(origin).source,
      emphasis: .runs)` — deterministic from the origin. Measured on both
      files: an unedited document published by the real EditorState reads back
      identical to exactly this, so the app's no-edit save is byte-identical
      by construction.

  FIXTURES — THE HUMAN'S REQUIREMENT. Two new fixtures, anonymised from files
  Final Draft wrote: apple/eDraftEngine/Fixtures/finaldraft-sample02.fdx (407
  TagNumber runs, revision marks, AdornmentStyle splits, 6 dual-dialogue
  blocks, an omitted scene, End of Act, an emphasised numbered heading, an
  italic parenthetical after dialogue, a trailing space) and
  finaldraft-sample01.fdx (a multi-line paragraph, an emphasised heading
  without INT/EXT, an italic parenthetical, a trailing space, an emoji,
  outline and Beat Board). Anonymiser v2: letters become x/X as before, but
  screenplay grammar words (INT, EXT, DAY, NIGHT, V.O., CUT TO, …) stay in
  headings, transitions, cues, parentheticals and shots, and as the first word
  of a paragraph — so Fountain's detection hazards survive. Measured: both
  anonymised files fail on today's code (engine and app path) and contain no
  real names.

  THE BLIND SPOT, MADE IMPOSSIBLE. A provenance guard runs in both ports:
  every fidelity fixture must carry no eDraft save marks (no bare
  `<Paragraph Type="…"><Text>` line, no xmlns:EDraft) and must carry the
  hazards listed above, counted. A fixture that has lost what the proof
  depends on fails the guard before the proof can pass vacuously.

  CONFORMANCE. fdx.json's rewrite section gains cases that read these files
  by name: the engine no-edit save and the app path (open → Fountain →
  rewrite with unedited), both expected identical to the file; plus
  synthetic cases for each leak and each correspondence rule. Swift must
  reproduce all of them.
