utterance: "Task: Replace the Apple Help Book with eDraft own in-app Help window. macOS 27 removed Help Viewer; legacy .help books route to Tips and show content unavailable. The offline help content already exists and must remain generated by the Xcode Run Script from IL-0113. Build a native offline AppKit NSWindowController plus WKWebView that loads index.html from the bundled eDraft.help in Resources, with a clean resizable Apple-like window, remembered size, back/forward navigation, a client-side search over bundled pages, and a View online link to https://edraft.xyz/help. Wire Help ▸ eDraft Help (⌘?) to open it, remove CFBundleHelpBookFolder and CFBundleHelpBookName from the macOS plist, and update the IL-0113 guard test. Follow docs/MACOS-DESIGN.md. Prove with tests that the window loads the bundled index and an article offline, and manually check Help opens our window, never Tips, with Wi-Fi off. This project requires a Code Director lock: draft it, show the Vibe Check, and wait for my yes."
goal: Replace obsolete macOS Help Viewer routing with a native in-app offline Help window backed by the generated eDraft.help resource, while preserving the generator and build phase.
