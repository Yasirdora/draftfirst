goal: "A ScriptNote's anchor lands where Final Draft's Range points: each block Final Draft embeds in a script paragraph (DualDialogue, OmittedScene) counts two units, so on both Final Draft-written fixtures every note is anchored and none lands mid-word — in both engines, proven failing on today's counting."
interpretation: |
  The counting fix the human queued after IL-0028 ("Range rule: embedded
  blocks +2, pinned by Final Draft-written files"), ahead of dual-dialogue
  visibility and Range maintenance. A reading fix only: which element and
  offset a note's Range lands on. No Range value is written.

  The rule, measured 2026-09-17 on Final Draft's own saves: a Range counts
  UTF-16 units over the script's top-level paragraphs, one per paragraph
  break, End of Act included — and each block Final Draft embeds inside a
  paragraph, <DualDialogue> or <OmittedScene>, counts two units, its own
  paragraphs' text nothing. IL-0024's reader counts those blocks as zero, so
  every position after one lands two units late per block before it.

  Prototyped at fc81475 and measured on the anonymised Final Draft-written
  fixtures (anonymisation keeps every letter's place, so word boundaries are
  the originals'):

    finaldraft-sample01.fdx (6 dual dialogues), 12 notes
      today: 9 on whole words, 2 mid-word, 1 with no anchor (falls past the
             script's end)
      fixed: 11 on whole words, 1 zero-length, none mid-word, all anchored
    finaldraft-sample02.fdx (6 dual dialogues, 1 omitted scene), 11 notes
      today: 8 on whole words, 2 mid-word, 1 with no anchor
      fixed: 10 on whole words, 1 zero-length, none mid-word, all anchored

  THE CHANGE, both engines: the paragraph collector records where each such
  block sits among its paragraph's text (it stays skipped as metadata); the
  Range layout adds two units per block at that place; a position that falls
  on a block's units maps to the text offset where the block sits. In every
  measured file the blocks sit after the paragraph's text (the omitted
  scene's "Omitted") or in a paragraph with none (dual dialogue), so offsets
  inside text are unaffected there.

  sample0-2.fdx is the eDraft-saved copy whose Ranges drifted; its pinned
  anchors (the IL-0024 corpus case and the tests on notes 107/110/112/137)
  move by two units per block before them. The anchor proofs move to the
  Final Draft-written fixtures, where "lands on the words it was written on"
  can be checked.

  Out of scope, next in the queue: dual-dialogue speech becoming visible (its
  own lock), Range maintenance, role, writing eDraft notes into ScriptNotes.
