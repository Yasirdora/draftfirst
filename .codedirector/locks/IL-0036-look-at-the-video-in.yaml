accept:
  - The EDraftUI test target compiles with the probe present.
  - Without Screen Recording permission the probe skips with an explicit message and prints no measurements.
  - With permission it prints per-variant meanLuma, maxChroma and mean-absolute-difference against the uncovered-label baseline.
  - apple/EDraftUI/Sources/EDraftUI/StoryPanel.swift is unchanged.
