utterance: look at the video in desktop folder see how can we make our 3 tabs like this, glass effect macOS 27 exactly like the video. is it possible
goal: "Rewrite the glass probe on ScreenCaptureKit, since CGWindowListCreateImage is obsoleted in macOS 15 and unavailable in the macOS 27 SDK. Add apple/EDraftUI/Tests/EDraftUITests/TmpGlassProbe.swift: an async XCTest that builds an on-screen window holding a groove, three labels and an NSGlassEffectView chip, captures it with SCScreenshotManager, and measures the label region across six variants to answer (1) does NSGlassEffectView.effectIsInteractive, new in macOS 27.0, change the chip's rendering, and (2) is a sibling label placed BELOW the chip in z-order refracted by it, or does the glass only bend the window backdrop. It must compile now and must skip with a clear message, never with fabricated numbers, when Screen Recording permission is absent. No production source or docs change."
interpretation: Replace the deleted CGWindowListCreateImage probe with a ScreenCaptureKit one in the same throwaway location. It must compile against the macOS 27 SDK today, and at runtime either print real measurements or skip loudly when Screen Recording is not granted.
