status: verified
utterance: "Audit hygiene, one at a time: add ITSAppUsesNonExemptEncryption = NO to both Info.plists (S3 — the crypto audit found no encryption, so export compliance is answered in the plist, not per upload), and set MARKETING_VERSION to 1.0 for both app targets (S2 — the store listing will say 1.0). CURRENT_PROJECT_VERSION stays 1."
goal: apple/macOS/Info.plist and apple/eDraft/Resources/Info.plist both carry ITSAppUsesNonExemptEncryption = false; MARKETING_VERSION is 1.0 in all four app-target build configurations; nothing else in the plists or the project moves.
interpretation: |
  TWO SURGICAL EDITS FROM THE READINESS AUDIT (IL-0078, 7fae8a2).

  S3 — EXPORT COMPLIANCE. The audit verified the app uses no encryption
  (no CryptoKit, CommonCrypto, or SecKey anywhere; Zip.swift only rejects
  encrypted members and decompresses). Adding ITSAppUsesNonExemptEncryption
  = false to both plists answers App Store Connect's export question once,
  in the bundle, instead of per upload. Placed in each plist's top-level
  dict, alphabetical position respected.

  S2 — VERSION. project.pbxproj carries MARKETING_VERSION = 0.1.0 in four
  places (iOS Debug/Release ~477/501, macOS Debug/Release ~570/599). All
  four become 1.0. CURRENT_PROJECT_VERSION is untouched (1 is a valid
  first build number). No other build setting changes. The xcscheme's
  foreign dirt stays foreign.

  PROOF. plutil -lint on both plists; grep confirms exactly four
  MARKETING_VERSION = 1.0 and zero 0.1.0; the macOS Debug build succeeds
  and the app's bundle reports 1.0 (defaults read on the built Info.plist).
