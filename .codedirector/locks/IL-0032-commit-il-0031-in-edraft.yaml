status: verified
utterance: Commit IL-0031 in eDraft and IL-0013 in Code Director, same convention, then draft the dual-dialogue lock.
goal: "Final Draft's dual dialogue is visible in eDraft: every line of a <DualDialogue> block imports as its own element, the second speaker's cue dual, and a save keeps the block — byte-identical when unedited, only the writer's characters changed when a line is edited, lines added inside it, the block dissolved only when the writer un-duals it — in both engines, proven on the Final Draft-written fixtures."
interpretation: |
  The dual-dialogue lock the human queued straight after the counting fix
  ("invisible dialogue is a fidelity emergency").

  MEASURED at 3b4f05f on both Final Draft-written fixtures. All 12
  <DualDialogue> blocks, 6 per file, have the same shape: a top-level
  General paragraph with no text of its own, holding one <DualDialogue>
  whose children are a SpellCheckIgnoreLists and four paragraphs —
  Character, Dialogue, Character, Dialogue — each with its own id, some with
  tags. The import reads nested paragraphs as metadata, so each block
  arrives as one empty General element (an empty action line in the app)
  and its 48 lines are invisible. A save keeps them only because it never
  looks inside.

  PROTOTYPED (TypeScript) at 3b4f05f:

    - import: sample02 780 elements (762 + 18), sample01 842; 6 dual cues
      each; no empty placeholder left; every ScriptNote still anchored on
      whole words or empty
    - no-edit save, through the engine and through Fountain: byte-identical,
      both files
    - a typo in either speaker's cue or line: exactly one character changes,
      inside the block
    - the whole dual dialogue deleted: its paragraph goes, blocks 6 to 5
    - a line added to the second speaker: written AFTER the block (Final
      Draft would show it as ordinary dialogue) ← rule 3 below
    - the caret removed (un-dual): the block stays dual in the file and the
      cue loses its tag ← rule 4 below

  THE CHANGE, both engines:

    1. Import. A top-level paragraph with no text of its own holding exactly
       one <DualDialogue> imports as that block's paragraphs, in order, each
       exactly as a body paragraph imports (type, text, runs, tags). The
       second speaker's cue is dual, as Fountain's `^` marks it. A Range's
       two units for the block land on its first line. Any other paragraph
       holding a <DualDialogue> (text of its own, or two blocks; none
       measured) imports as today and is reported,
       FDX_DUAL_DIALOGUE_NOT_READ, so no dialogue is ever silently
       invisible.
    2. Save, lines. To the preserving save each line of a block is its own
       paragraph: unedited, its own bytes (IL-0027); edited, the writer's
       characters merged into it (IL-0028). The block's frame (the outer
       paragraph's tags, <DualDialogue>, SpellCheckIgnoreLists, whitespace)
       is written verbatim around them.
    3. Save, lines added. Lines the writer adds within the pair, from the
       first cue to the second speaker's last line as Fountain reads a dual
       pair, are written inside the block where they stand.
    4. Save, dissolved. When the lines kept from a block no longer form a
       dual pair — the caret removed, or the lines no longer contiguous —
       the block is dissolved: its lines are written in its place as
       ordinary paragraphs, each keeping its own bytes where unedited, and
       the frame goes. Reported: FDX_REWRITE_DUAL_DIALOGUE_DISSOLVED.
       Deleting the whole pair removes the block, as measured.

  NOT IN SCOPE: a dual pair made in eDraft becoming a new <DualDialogue>
  block, and the fresh export writing one. Both mean writing a form Final
  Draft has not been shown to accept (the human's Final Draft check), so
  today's Dual="Yes" stays for them. Side-by-side display: the app lists the
  two speakers one after the other, the second cue marked `^`, as it
  already does for Fountain.
