schemaVersion: 1
id: IL-0025
status: verified
utterance: Then I want the End of Act deletion fixed next — silent data loss on save jumps the queue ahead of the notes UI. Draft it as its own lock with the same round-trip rigor. The notes surfacing lock comes after that.
goal: Saving a Final Draft file never loses or corrupts an End of Act card. A save with no edit returns the file byte for byte — through both engines and through the app's own open-and-save path — and an edit changes bytes only inside the paragraph the writer edited. An absorbed End of Act is never paired with a script element, so it can never take a writer's text, and it is kept in its place.
interpretation: |
  Measured 2026-09-17 at 10ba913, in both ports, before any design.

  TWO FAILURES, ONE CAUSE. The import absorbs End of Act (RFC-ACT-BREAK D3),
  so no script element stands for it. The preserving save only writes origin
  paragraphs that pair with an element; everything between the first and last
  body paragraph is otherwise replaced. So:

    1. DELETION. Any save, with no edit, drops every End of Act card.
       sample0-2.fdx loses its one card (261 chars) through Fdx.open/openFdx,
       and identically through the app's real path (ScreenplayFile.open →
       Fountain → ScreenplayFile.encode). Nothing else is lost on that path —
       the 11 elements Fountain retypes (shot, general) are already recovered.
    2. CORRUPTION. The absorbed span is typed `general` when the card has no
       Alignment attribute, and `general` is in FOUNTAIN_FLATTENS, so the
       edit-in-place pass pairs it with the writer's next edited paragraph.
       Measured: editing "Buzz." to "Buzz, buzz." after a bare card writes
       <Paragraph Type="End of Act"><Text>Buzz, buzz.</Text></Paragraph> —
       the writer's line becomes an act ending in Final Draft, the real Action
       paragraph and its attributes are gone, and so is the card.

  RFC-ACT-BREAK §3 records the opposite ("a file we import and never edit
  keeps its bytes, End of Act paragraphs included"). It was never tested:
  every no-op identity test in both ports uses a file without an End of Act.

  THE FIX. The save gives absorbed paragraphs an owner instead of leaving them
  to the alignment:

    - The origin spans mark a paragraph the import absorbed. The two readers
      keep deciding "absorbed" from the same rule (Type is End of Act).
    - Alignment — the longest-common-subsequence and the edit-in-place pass —
      sees only spans the import turned into elements. An absorbed span can no
      longer be matched, paired, retyped or given text.
    - The rewrite writes each absorbed span verbatim, with the whitespace that
      preceded it, immediately before the first paragraph after it in the file
      that the save still keeps. With none left after it, it goes after the
      last element. Several in a row keep their file order.

  Anchoring to what FOLLOWS is what keeps an act's shape: lines a writer adds
  at the end of act one land before END OF ACT ONE, because they are inserted
  before ACT TWO and the card travels with ACT TWO.

  No-op identity follows by construction: every span is emitted once, in
  order, with its own lead.

  NOT CHANGED. The import (parseFdx / Fdx.parse), the ScriptNotes reader and
  the fresh export (writeFdx / Fdx.write) have no changed lines, so every
  existing fdx.json case keeps its expected output. End of Act stays absorbed
  and invisible in eDraft; the model and Fountain gain nothing.

  RIGOR, mirroring IL-0024:
    - both ports, no-op byte identity on the committed sample0-2.fdx, and the
      same through EDraftCore's ScreenplayFile open → encode (the app's path);
    - an edit sweep over the fixture — including the card's neighbours — where
      every byte outside the edited paragraph must match the original;
    - a new `rewrite` section in fdx.json pinning Swift's save output to
      TypeScript's byte for byte on act-shaped scripts: no-op with centred and
      bare cards, the hijack edit, lines added at the end of an act, the act
      break after a card deleted, everything after a card deleted, a card
      first in the body, two cards in a row;
    - RFC-ACT-BREAK §3 corrected to state the mechanism and the test that
      now holds it.
