  - "Edit sweep: for elements across the fixture, including those beside the End of Act card, every byte outside the edited paragraph matches the original, in both ports."
  - The rewrite section of fdx.json is reproduced byte for byte by Swift.
  - "Existing suites stay green: 632 TypeScript package tests, 170 Swift engine tests, and every EDraftCore test, 0 failures."
