utterance: '[screenshot of the guide bar: "eDraft User Guide for Mac", "Search this guide", "Table of Contents ⊕"] we could use this in home page of help and support'
goal: "The Help Center home opens with the same guide bar every article has — \"eDraft User Guide for Mac\", Search this guide, Table of Contents — and the home has one search, not two: the guide bar's field filters the home's results live as the reader types (as the hero field does today), and still works as a plain GET form with JavaScript off. The hero keeps its title. On article pages the bar is unchanged."
interpretation: |
  THE BAR ON THE HOME. /help opens with GuideBar — the guide's name, Search
  this guide, the Table of Contents — above the "How can we help?" title,
  exactly as every article opens.

  ONE SEARCH. The home's hero search field goes; the guide bar's field is
  the home's search. GuideBar gains an optional bindable `query` and a
  `live` flag: on the home it is bound to the page's query, so results
  filter as the reader types (today's behaviour, including ↓ to the first
  result). Submitting stays a GET to /help?q=: with JavaScript on, the home
  reads ?q= and lists the matches (as today); with JavaScript off the
  prerendered home reloads with its full All topics index (as today — a
  static page cannot read the query). On article pages the bar is used
  exactly as now and behaves as now.

  NOT CHANGED. The results list, the topic icons, the guide panel, the
  columns and All topics; topic pages; articles.ts and every test file;
  the shared site chrome.
