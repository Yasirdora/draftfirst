id: IL-0099
status: verified
utterance: "Yes — take the banner task. Draft the lock, Vibe Check first, wait for my yes. Note the pattern has advanced since your notification was written: PageLockNoticeAccessory (IL-0090, committed) is the current house pattern — a titlebar accessory docked under the toolbar, not a floating view. Follow it."
goal: The Mac document window shows EditorState.banner the way it shows the page-lock notice — a titlebar accessory docked under the toolbar, one strip, until the writer dismisses it — and never tells the writer a change came from elsewhere when it was their own Revert To.
interpretation: |
  THE BUG. `EditorState.showBanner` sets `banner` for 1.6 s and only the
  iPhone's EditorView draws it. The Mac window never does. Messages the Mac
  can raise today, all invisible:
  - "Updated elsewhere" — `applyExternalSource`, reached on the Mac from
    `ScreenplayDocument.read(from:)` whenever a window is already open.
  - "A change from elsewhere couldn't be read" — same path, unparseable text.
  - "This document cannot allocate another element identity" — three sites
    in EditorState, when an edit is refused.
  (The other showBanner callers — scan, Save As, "Added N elements" — are the
  iPhone's EditorChrome and never run on the Mac.)

  THE PATTERN (owner's instruction): IL-0090's titlebar accessory, docked
  under the toolbar with `layoutAttribute = .bottom`, so AppKit lays the
  page out below it and no line sits under it at rest (MACOS-DESIGN §1.6).
  Following it means its lifetime too: the strip stays until the writer
  dismisses it, and a newer banner replaces its words in the same strip. The
  model's 1.6 s timer stays the iPhone capsule's; on the Mac a docked strip
  that left after 1.6 s would move the page down and back up inside two
  seconds, too fast to read the sentence it carried.

  THE GENERALISATION: `PageLockNoticeBar` / `PageLockNoticeAccessory` become
  `WindowNoticeBar` / `WindowNoticeAccessory` in `WindowNotice.swift`
  (`git mv` of PageLockNotice.swift), unchanged in behaviour — one class
  serving two notices, not a copy of it named after the wrong one.
  PageLockNoticeSurfaceTests changes only the type name it looks for.

  THE HONESTY FIX (found while scoping): `ScreenplayDocument` autosaves in
  place, so `read(from:)` with a window open is reached two ways — AppKit
  reloading a file that another device or app changed, and the writer's own
  File ▸ Revert To. Both call `applyExternalSource`, which says "Updated
  elsewhere". Once the Mac shows banners, a Revert To would say something
  false. Fix:
  - Core: `applyExternalSource(_:announcing: Bool = true)`; `false` applies
    the text without "Updated elsewhere". The iPhone's call is unchanged.
    The unreadable-change banner is raised either way — a failure is never
    silenced.
  - ScreenplayDocument decides where AppKit reloads, in
    `revert(toContentsOf:ofType:)` on the main thread: announce only when it
    reads the document's own file AND that file's modification date on disk
    differs from the one this document last read or wrote. Scoped to that
    one call, so nothing lingers. The writer's own Revert To reads a saved
    version (another URL) or a file this document wrote itself (same date):
    quiet. Anything it cannot tell apart is quiet, as every Mac reload is
    today — silence is the failure mode.
  - REVISED BEFORE ACTIVATION (peer review from the owner's second session,
    then measured): the first draft kept an "outside change" record set in
    `presentedItemDidChange` and cleared by `revertToSaved(_:)` /
    `browseVersions(_:)`. A headless NSDocument probe (2026-09-23, scratch)
    showed `presentedItemDidChange` arrives off the main thread and returns
    BEFORE AppKit reloads (`revert(toContentsOf: fileURL)` then `read`, on the
    main thread), and that it also fires when nothing changed — on open and
    after every reload. That record would be set nearly always, and any
    revert path not through the two overrides (AppKit inserts dated "Last
    Opened" / "Previous Save" items into the app's own Revert To submenu,
    MainMenu.swift:73-76) would say "Updated elsewhere" falsely. Probe:
    outside change → own file, dates differ (announce); a revert of the file
    with no outside change → dates equal (quiet); spurious notices → no
    reload at all.
  - The Mac app target has no test target, so this half is proved by the
    probe's measurements and the manual checks below, stated as such.

  TESTS (fail-before = at HEAD, where nothing docks):
  - EditorBannerSurfaceTests (new): nothing docked at open; a banner docks
    under the toolbar (.bottom, its words, content area shrinks); it stays
    after the model's timer clears `banner` and leaves when dismissed; a
    newer banner replaces the words — one strip; `applyExternalSource`
    docks "Updated elsewhere" and `announcing: false` docks nothing; the
    banner and the page-lock notice dock together and dismissing one
    leaves the other.
  - ExternalSourceAnnouncementTests (Core, new): the default announces
    "Updated elsewhere" (the iPhone's behaviour, pinned for the first time);
    `announcing: false` applies the text and raises no banner; unreadable
    text raises "couldn't be read" with `announcing: false` too.

  MANUAL (the document half; the owner on screen, the outside change made
  from the shell):
  - An open script's file changed from outside: the strip says "Updated
    elsewhere".
  - File ▸ Revert To ▸ Last Saved / Last Opened / Previous Save (whichever
    AppKit lists), and Browse All Versions ▸ Restore: no strip for any.
  - The peer's sequence: an outside change while the script has unsaved
    edits, then Revert To ▸ Last Opened: no strip.
  - VoiceOver announces the strip's words when it arrives (IL-0090's bar
    posts it on appear; a replacement is a new bar, so it announces again).
