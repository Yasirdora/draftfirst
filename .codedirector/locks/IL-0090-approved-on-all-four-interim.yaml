utterance: "Approved on all four: interim warn lock (quiet, once per document per session), RFC amended as argued, page parity as documented v1 limit with its own stage later, and generate the E-script — I'll run E1–E8 in Final Draft tonight. The Position rule is the hard gate: if the E-files don't pin it, Freeze Page doesn't ship and we stay read-and-warn. One design change: pin glyph, not snowflake — this is a production tool. Proceed with professionalism"
goal: When a writer edits a Final Draft file that carries page locks, eDraft tells them once per document per session, quietly and without covering the page, that those locks do not move with edits in eDraft yet — so nobody ships a file whose locked pages silently point at the wrong text without having been told.
interpretation: |
  WHY. Measured 2026-09-22: Final Draft moves every `<LockedPage Position>`
  with the text (probe-B: +46 for 46 units inserted), but eDraft's splice
  writes `<LockedPages>` back byte for byte — so after any edit above a
  locked page, the file eDraft saves has locks pointing at the wrong text in
  Final Draft. The real fix needs the absolute Position rule, which the
  owner's E1–E8 run is measuring. Until then eDraft tells the writer. This
  lock changes no bytes eDraft writes.

  WHEN. A document whose Final Draft origin carries `<LockedPage>` entries
  (counted once at open from the origin string — a narrow, named scan like
  `Omissions.recordedEighths`, retired when the engine models locks). On the
  writer's first edit — typing (`applyLiveText`), any structural edit
  (`commitChange`, omit/restore included) or undo/redo (`restore`) — the
  notice is raised. Once per document per session: dismissing it, reverting,
  or editing again never raises it a second time. A file with no locks, a
  Fountain or .edraft document, or a locked file that is only read and
  saved unedited, never sees it. The check is one flag at those three
  points — no per-keystroke document work.

  WHAT IT SAYS. Plain, one sentence and a clause, no alarm:
  "This script has Final Draft page locks. eDraft doesn't move them with your
  edits yet, so in Final Draft some locked pages may start in the wrong
  place." The wording is the owner's to change.

  WHERE (MACOS-DESIGN §1.6 — nothing floats over the page). A strip docked
  under the toolbar (`NSTitlebarAccessoryViewController`, layout `.bottom`),
  the way Safari and Mail dock their notices: AppKit shrinks the content
  area for it, so it never covers a line. Quiet: `info.circle` in secondary
  ink, subheadline text, one Dismiss (xmark) button, regular material — the
  look of `LaunchTrashBanner`. It stays until dismissed or the window
  closes. VoiceOver hears it once when it appears (announcement), and the
  strip is an accessibility element with its text as the label.

  NOT HERE. The Mac's `editor.banner` gap (showBanner is never displayed on
  the Mac) is its own task (chip task_6b6fed65), not this lock. iOS shows
  nothing new — the Mac is where Final Draft files are worked on; the model
  flag is shared and ready for the phone later.
