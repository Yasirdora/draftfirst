utterance: "Launch window: a quiet undo banner after Move to Trash (macOS). After trash, a banner \"'Name' moved to Trash\" with Undo, auto-dismiss ~6s. Undo puts the file back via trashItem resultingItemURL. Latest delete replaces the banner. apple/macOS/EDraftMacApp.swift is required for one change: capture resultingItemURL and return it from trash (LaunchActions.trash currently returns Void and the app passes nil). Without that, undo cannot be real. Also LaunchWindow.swift, optional banner sibling, and EDraftMacSurface tests."
goal: After Move to Trash the launch window shows a quiet undo banner. Undo restores the file. If Trash was emptied, Undo disables with no dialog. Latest delete replaces the banner.
interpretation: Undo banner on the Mac launch window after Move to Trash. LaunchActions.trash returns the Trash URL. EDraftMacApp.trash captures resultingItemURL. Banner replaces on a later delete. Undo moves the file back; if it is gone Undo disables with no dialog. No Recently Deleted UI.
