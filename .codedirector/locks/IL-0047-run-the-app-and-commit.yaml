  - text: "Budget widened by the human during the build (2026-09-19): packages/edraft/src/platform.ts, for a two-line fix. Measured: inflateRaw leaves the write side's promise unhandled when the stream is corrupt, truncated or empty, and Node exits on the unhandled rejection even though the read error is caught; the .docx import has the same exposure. The tolerant reader passes damaged entries to it, so without the fix a damaged .draft could end the process. Regression test in zip.test.ts."
    source: user
    confirmed: true
