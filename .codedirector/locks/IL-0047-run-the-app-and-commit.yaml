  - kind: custom
    text: every existing conformance fixture and corpus expectation is byte-identical after regeneration, and the .docx writer's output does not change
  - kind: custom
    text: the apps are unchanged — no file under EDraftCore, EDraftUI, the Mac or iOS surfaces, the app targets or the web app is touched, and opening and saving .draft in eDraft behaves exactly as today
  - kind: custom
    text: the TypeScript and Swift engines write byte-identical .draft files for every conformance case, and read every case to the same document
  - kind: custom
    text: no reader path crashes on any input, opens damaged data without saying so, or discards bytes it was given — every rung of the recovery ladder says what it kept and what it lost
