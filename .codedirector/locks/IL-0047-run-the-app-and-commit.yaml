accept:
  - "WRITE, both engines: a document writes an ISO/IEC 21320-1-profile ZIP — mimetype stored first (its content at byte 38), §4.2's order, the 1980-01-01 stamp, the UTF-8 flag rule, canonical JSON parts, a manifest with each part's SHA-256 and JCS fingerprints — and the two ports write identical bytes for every conformance case (B4)."
  - "READ: every conformance case reads back to the same document in both ports; ids, nextId, threads with word anchors, messages, status, origin parts and the rendition all survive."
  - "MUST-PRESERVE: unknown parts and unknown members survive read and write byte for byte (B5); a file whose minReader is newer opens read-only; a newer major is refused."
  - "RECOVERY: each rung of §7.2 pinned — an outside edit (hash differs, part valid), a damaged part kept byte for byte, script.json damaged so the rendition opens it with threads detached, a truncated file read from its local headers, nothing readable refused; §4.3's limits refuse with a reason."
  - "FUZZ, both engines: every single-byte change and every truncation of the fixture files — no crash, and nothing damaged opens without a diagnostic (B3)."
  - "LEGACY: detection by first bytes for .draft 1.x, PDF, FDX, UTF-8 text and refusal; an XML file named .draft is FDX (B7, engine half)."
  - "BRIDGES: fromScreenplay and toScreenplay round-trip every existing parse-corpus case's printable elements and notes; a word anchor degrading to its line is a diagnostic."
  - "MEASURED AND REPORTED: B1 (size against FDX on the fixtures, stored and with omnipdf's deflate) and B2 (open time), for O1."
  - "KEEPS: every existing fixture byte-identical; the .docx writer's bytes unchanged; suites green — TypeScript, the Swift engine, EDraftCore."
