schemaVersion: 1
id: IL-0047
status: abandoned
utterance: "run the app and commit as well after that proceed with professionalism — [next: RFC-DRAFT-FORMAT stage S1, the engine]"
goal: Both engines read and write the .draft 1.0 container of RFC-DRAFT-FORMAT §4–§11 — the ISO/IEC 21320-1 ZIP profile, the manifest with per-part SHA-256 and RFC 8785 fingerprints, script.json with stable counter ids, notes.json threads, the Fountain rendition, origin/ parts, must-preserve of unknown parts and members, the recovery ladder, the limits, and legacy detection by first bytes — byte-identical across TypeScript and Swift, with entries stored (deflate writing waits for O1/O2); the apps are unchanged.
interpretation: |
  RFC-DRAFT-FORMAT's stage S1 (d224dbf), narrowed so it depends on no open
  decision. The engine only, both ports; TypeScript is the source of truth
  and the Swift port matches it through generated conformance fixtures
  (HANDOFF rule 2). No app, no UI, no document class changes: opening and
  saving in eDraft behave exactly as today until S2.

  WHAT EXISTS (measured):
    - TypeScript: zip.ts reads stored and deflated entries (inflate through
      the platform), with limits of 512 entries / 64 MiB / 128 MiB;
      zipwrite.ts writes stored entries, deterministically, but stamps DOS
      date 0 and never sets the UTF-8 flag; crc32.ts.
    - Swift: CRC32.swift only — no ZIP reader or writer, no SHA-256.

  WHAT IT BUILDS, both engines:
    1. The container (§4): mimetype first and stored; entries in §4.2's
       order; the 1980-01-01 stamp; bit 11 for non-ASCII names; §4.2's
       path rules; §4.3's limits enforced before decompressing or parsing.
       zipwrite.ts gains these as options; its defaults — the .docx
       writer's bytes — do not change.
    2. The parts (§5): canonical JSON (§5.1); manifest.json with SHA-256
       per part and RFC 8785 (JCS) fingerprints; script.json with counter
       ids and nextId (§6.1); notes.json threads; script.fountain written
       by the existing serialiser; origin/ parts carried byte for byte.
       SHA-256: a small own implementation in TypeScript (the engine is
       dependency-free and synchronous; Web Crypto's digest is async),
       CryptoKit in Swift; both pinned by the same vectors.
    3. Must-preserve (§8.2): unknown parts and unknown members survive a
       read and write byte for byte; minReader and version rules (§8.1).
    4. The recovery ladder (§7.2), every rung, including reading a
       truncated file from its local headers.
    5. Legacy detection by first bytes (§11.1): .draft 1.x, PDF, FDX,
       UTF-8 text, refused.
    6. Bridges for today's apps, so S2 can adopt the format without a big
       bang: fromScreenplay (counter ids; each note element becomes a
       thread anchored to the whole element after it, §6.6 — its text kept
       whole; author recognition stays in EDraftCore) and toScreenplay
       (threads back to note elements in front of their element; a word
       anchor degrades to its line, said in a diagnostic).

  DEFERRED, named:
    - Writing deflated entries — O1 (compression) and O2 (omnipdf as a
      dependency or a port) are the human's. Readers accept deflate now;
      writers store. S1 measures and reports B1 (size) for stored and for
      omnipdf's deflate, and B2 (open time), which is what O1 needs.
    - The apps (S2), notes on words (S3), threads UI (S4), the .draft PDF
      (S5), platforms (S6), publication (S7).

  FIXTURES: invented script text only (the repository is public).
keep:
