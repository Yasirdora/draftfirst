schemaVersion: 1
id: IL-0040
status: verified
utterance: Fix dialogue bug first — draft the note-in-dialogue fix as its own lock, land it, then run IL-0039 as drafted with decisions 1 to 4 as proposed.
goal: "A note, section or synopsis the writer leaves inside a dialogue block — between a cue and its speech, around a parenthetical, before a dual second speaker — no longer breaks the block: on save and reopen the cue stays a cue and the speech stays speech, in both engines, through the editor and through an FDX save; single-line notes stay exactly where they were, and every existing corpus expectation is unchanged."
interpretation: |
  The note-in-dialogue corruption, ahead of IL-0039 (the human's order).
  The serialiser only, in both engines. The parser is unchanged.

  MEASURED at ab67d4d. The editor puts a note in front of the line it is
  about. When that line is inside a dialogue block, the serialiser writes
  the note as its own paragraph between blank lines, which ends the block.
  On reopen the cue and the speech read as Action. 10 of 11 placements
  inside a block break; an aside after the block, or in front of a dual
  second speaker's cue, survives:
    cue, NOTE, speech               -> action, note, action
    cue, NOTE, NOTE, speech         -> action, note, note, action
    cue, NOTE, paren, speech        -> action, note, action, action
    cue, paren, NOTE, speech        -> ..., note, action
    cue, speech, NOTE, paren, speech -> ..., note, action, action
    cue, NOTE, speech with emphasis -> action, note, action
    (cue, speech, NOTE, dual cue survives. Corrected during the run: the
     first probe marked the second speech dual too, which the parser never
     does, so it misreported this case as broken.)
    dual cue, NOTE, its speech      -> action "ANN ^", note, action
    cue, SYNOPSIS, speech / cue, SECTION, speech -> the same break
  An FDX save writes the damage into the file as Type="Action" paragraphs.
  sample02.fdx has three such pairs: one from an eDraft save before 07:15
  today, two from this morning's test.

  THE RULE, serialiser, both engines. A dialogue block is a cue with its
  parentheticals and speech lines; a dual second speaker continues it. For a
  run of asides with a block line before it and a line of the same block
  after it:
    1. If every aside in the run is a one-line note, and the element after
       it is a parenthetical or a speech line, the run is written inline at
       the end of that element's first line: `Hello. [[n1]] [[n2]]`,
       `(beat) [[n1]]`. Reopened, the same elements come back in the same
       order (measured, every case). A run in front of a dual second
       speaker's cue is written as before.
       IL-0038's spelling applies inside the brackets.
    2. Otherwise — a note of more than one line, a section or a synopsis,
       none of which Fountain can carry inside a block — the whole run is
       written in front of the block's cue, in order. The block survives, no
       word is lost, and those asides move from their line to the cue's line
       of the same block. Measured: a multi-line note written inline either
       still breaks the block or comes back after the speech.
    3. Also rule 2: when the element after the run has an empty first line.
    4. Everything else is written as today: an aside before a cue, after a
       block, or outside dialogue.

  ALREADY BROKEN FILES: `CUE` / blank / `[[note]]` / blank / `Speech` reads
  the same way an action line in capitals followed by a note reads, so the
  reader cannot tell them apart. Recorded as permanent in RFC §13, with the
  pattern. sample02's three pairs are repaired by hand in IL-0039's
  validation, as the human decided.

  SCAN, count-only, same file set as IL-0038 (fixtures, corpus, ~/Documents,
  eDraft's iCloud folder, Final Draft's documents and Backup, Arc Studio):
  broken pairs are found only in sample02 and its copies — the current file
  (2 by the scan's pattern; 3 by the paragraph types), the 08:18 reference
  (1), and Final Draft's six sample02 backups from today. None in any
  fixture or corpus case. No corpus case has an aside inside a dialogue
  block, so no existing expectation should change.

  Out of scope: the parser; IL-0039's ScriptNotes; the editor's placement of
  notes (unchanged — the serialiser now carries it).
