accept:
  - Each measured placement — cue/note/speech, two notes, around a parenthetical, mid-speech, between two lines of a speech, emphasis, inside a dual second speech — saves and reopens to the same elements in the same order. Both engines; each fails today. A note in front of a dual second speaker's cue is written as before (a keep).
  - "A note of two lines, a section and a synopsis inside a block: the block survives, the words are all there, and the asides sit in front of the block's cue. Named as rule 2. Both engines; each fails today."
  - "Through the editor (EDraftCore): a note added to a speech line leaves the published source reading a cue and its speech. Fails today."
  - "Through an FDX save (TypeScript and EDraftCore): a note added on a speech line of a Final Draft file keeps the cue's and the speech's paragraph Types and bytes. Fails today — the sample02 damage."
  - "Corpus: a new asides-in-dialogue case in parse.json and serialise.json, identical in both ports; every existing case unchanged; fdx.json, paginate.json, predict.json and the rest byte-identical."
  - "RFC: §2.1's measured note (\"lands between the cue and the speech\") records the break and this fix; §13 records already-broken files as permanent, with the pattern."
  - "Suites green: npm run test:package, swift test --package-path apple/eDraftEngine, swift test --package-path apple/EDraftCore."
