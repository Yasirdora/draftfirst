schemaVersion: 1
id: IL-0015
status: verified
utterance: add notes to the side panel tabs so it's scenes, cast, notes
goal: The Navigator's scope switch carries a third tab, Notes, after Scenes and Cast. It lists the script's writer notes (EditorState.notes), each row showing the note and the scene it sits in; choosing one jumps to the line it is anchored to. The Mac filter field and the footnote's second line both learn the new tab. No change to the note model, to how notes are stored, or to the Scenes and Cast lists themselves.
interpretation: "Add a third case to StoryPanel.Tab and teach StoryList the list behind it. The source already exists: EditorState.notes returns the document's [[note]] asides, each carrying an anchor — the id of the page element it sits in front of. A note is a place, like a scene and unlike a character, so its row jumps: open(anchor). The scene a note sits in is derived inside EDraftUI from editor.screenplay.elements and editor.scenes, so EDraftCore needs no new property. MacScopeBar is already driven by Tab.allCases for its labels, cell width, chip seat, hit test and arrow-key stepping, so the third segment needs no geometry work — only the doc comment that says 'Scenes · Cast' and the rawValue-count assumptions in the tests. A NoteListFilter matches the shape of SceneListFilter and CastListFilter so the Mac ⌘L-style filter field works on Notes too."
