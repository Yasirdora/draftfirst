id: IL-0062
status: verified
utterance: "Then your real lane: IL-0039 — ScriptNotes Stage 1, notes pinned to words, per docs/RFC-NOTES-SYSTEM.md. Your budget is the engines only: packages/edraft, apple/eDraftEngine, apple/EDraftCore, their fixtures and tests."
goal: "Notes pinned to words in both engines — RFC-NOTES-SYSTEM stage 4 (range anchors), engine half only: a note carries an optional anchor of quoted words; Fountain writes and reads `on:`/`nth:` (§5.2); §5.3's disambiguation rule is pinned case by case in both ports; FDX computes an anchored note's Range from its words instead of its whole paragraph and derives `on:`/`nth:` back from a Range on read (§5.1, §5.4); FDX to Fountain and back keeps the words. Byte-identical across TypeScript and Swift, no `EDraft:` attribute written anywhere, and no surface, UI or app file touched."
interpretation: |
  WHAT THE USER ASKED FOR, AND WHAT THIS LOCK IS. The request names
  "IL-0039 — ScriptNotes Stage 1, notes pinned to words". Measured in the
  repository, those are two different stages and stage 1 is already history:

    - Stage 1 (round trip: notes as real <ScriptNote>s, the name prompt,
      the `]` fix) was built by IL-0041 and amended by IL-0042/IL-0043,
      committed in fbd7eb9 (2026-09-18), an ancestor of HEAD. The RFC says
      so in §11 itself. IL-0039 was the first, failed attempt at that same
      stage; its lock reads status: failed and Code Director 0.4.5 cannot
      re-activate a failed lock.
    - "Notes pinned to words" is stage 4 — range anchors (§11, "Stage 4 —
      range anchors"). The RFC is explicit that stage 1's anchor is the
      whole paragraph: "a new thread's Range is its whole paragraph; words
      come in stage 4."

  So this lock carries the user's actual subject — notes pinned to words —
  under its true stage number. It is a new id because IL-0039 is spent.

  THE CARRIER, MEASURED, AGAINST THE BRIEF. The brief says the Final Draft
  13.4.0 probe found that "EDraft: attributes survive Final Draft
  round-trips, so the carrier is attributes-first with the header line as
  fallback". The probe measured the opposite, and the probe files still say
  so on disk today:

    probe.fdx / probe-A-saved.fdx / probe-B-Edited.fdx
    EDraft:<Attr> occurrences: 0 / 0 / 0   ScriptNotes: 14 / 14 / 16

  RFC §3 fact 1: "Final Draft strips every unknown attribute on a plain Save
  As. EDraft: occurs 9 times in the probe and 0 times in both saved copies."
  Fact 2: the same save erases eDraft highlights. The RFC's conclusion is
  quoted here because it decides this lock's design: "Everything a thread
  needs must live in text Final Draft preserves. Note text does (fact 1);
  attributes do not. There is no fallback to switch to."

  Nothing attributes-first is therefore built. In FDX the anchor is the
  Range — which Final Draft keeps and moves with its words (fact 5, and
  IL-0033) — and the note's own fields, which survive (facts 3, 6, 9). In
  Fountain, where there is no Range, the anchor is the quoted words in the
  `on:`/`nth:` grammar the RFC already specifies. No `EDraft:` namespace is
  written into any file by this lock, in either port.

  WHAT IT BUILDS, both engines, TypeScript first and Swift pinned to it by
  the shared conformance fixtures:

    1. THE ANCHOR ON THE MODEL. A note element gains an optional anchor —
       the quoted words and an optional nth. Optional and omitted when
       absent, so every existing corpus case serialises exactly as today
       and the untouched fixtures stay byte-identical.
    2. THE RULE (§5.3), one implementation per port, shared by both
       formats: search only the note's own paragraph, from its start; first
       occurrence unless `nth:N`; write `nth` exactly when the words occur
       more than once at the time of writing; exact UTF-16 matching, casing
       included; words gone or fewer than N anchors to the whole paragraph
       and is flagged "words changed", never moved, never guessed; an
       anchor never spans paragraphs in Fountain.
    3. FOUNTAIN (§5.2, §4.4): `on:`/`nth:` written and read, the thread's
       paragraph being the one that follows the note. §4.4's spelling and
       IL-0038's `]` fix hold unchanged.
    4. FDX (§5.1, §5.4): an anchored note's Range is computed from its
       words by IL-0031's counter instead of `paragraphRange`; on read, a
       note eDraft owns derives `on:`/`nth:` from the words its Range covers
       in the first paragraph it touches. A Range spanning paragraphs keeps
       its full span in FDX and anchors to its first paragraph in Fountain
       (§5.3 rule 6). Notes with no anchor keep today's whole-paragraph
       behaviour byte for byte.
    5. CONVERSION: FDX to Fountain and back keeps the words.

  WHAT IS NOT IN THIS LOCK, AND WHY. Stage 4's other half is the surface:
  capturing the writer's selection and placing a thread visually in the
  editor. Those files are apple/EDraftMacSurface/** (ChatGPT holds active
  lock IL-0054 over it) and apple/EDraftUI/** (Grok's title-page work).
  Both are denied here. The engine half stands alone and is provable
  without them: it takes an anchor and returns bytes. If the work turns out
  to need either package, the run stops and the user is told — the budget
  is not widened here.

  Also not built: stage 2 threads and stage 3 resolve (their carrier is
  decided for `.draft`, not FDX), the stage 5 report, and stage H's
  highlight carrier. PdfSignal is untouched (acf7673).

  FIXTURES: invented script text only — the repository is public.

  FINAL DRAFT CHECK: the RFC's stage protocol requires the human to open an
  eDraft-written probe in Final Draft before the stage is committed —
  "a note eDraft anchored to words shows on those words in Final Draft, and
  keeps them through a Final Draft save." This lock prepares that probe
  file and stops. No commit is authorized.
