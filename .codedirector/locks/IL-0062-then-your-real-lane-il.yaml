    text: a note with no word anchor keeps today's whole-paragraph Range exactly, in both ports — anchoring is additive
  - kind: custom
    text: the two ports agree byte for byte on every notes conformance case, and read every case to the same document
  - kind: custom
    text: Final Draft's own notes keep every byte but their Ranges; a body Note paragraph stays a body paragraph; a note ending in `]` still round-trips (IL-0038)
  - kind: custom
    text: the apps are unchanged — no file under EDraftMacSurface, EDraftUI, the app targets, the Xcode project or docs/ is touched, and the foreign working-tree changes are left exactly as found
