accept:
  - "RULE: §5.3's cases each pinned in both ports — first occurrence; `nth:N`; `nth` written only when the words repeat; exact UTF-16 casing (a thread quoting MARA does not land on Mara); words gone or fewer than N anchors to the paragraph and is flagged \"words changed\"; never moved to another paragraph."
  - "FOUNTAIN: a note with `on:` round-trips to the same words; without `on:` it anchors to the whole paragraph, exactly as today; the thread's paragraph is the one that follows the note; §4.4's spelling and the `]` fix (IL-0038) hold."
  - "FDX WRITE: an anchored note's Range covers its words, counted by IL-0031's rule; an unanchored note's Range is its whole paragraph, byte-identical to today."
  - "FDX READ: a note eDraft owns derives `on:`/`nth:` from the words its Range covers in the first paragraph it touches; a Range spanning paragraphs keeps its full span in FDX and anchors to its first paragraph in Fountain."
  - "CONVERSION: FDX to Fountain and back keeps the words on every corpus case that has notes."
  - "PORTS: TypeScript and Swift produce identical bytes for every case in noteanchor.json and read every case to the same document."
  - "KEEPS PROVEN, not asserted: a no-edit save of each Final Draft-written fixture is byte-identical; Final Draft's own notes keep every byte but their Ranges; no `EDraft:` attribute appears in any written file; untouched fixtures byte-identical after regeneration."
  - A probe file is prepared for the human's Final Draft check (RFC §11 stage protocol) and the lock stops there — no commit.
