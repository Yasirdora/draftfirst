schemaVersion: 1
id: IL-0003
status: verified
utterance: "remove the zoom options drop down from the toolbar. the box icon becomes a book icon for distraction-free mode. instead of zoom, i want layout modes: a grid view with 3 to 6 pages per row depending on what fits on screen, as a bird's-eye view. and a two-page mode, pages side by side with thin hairline like an open book."
goal: "Toolbar: Focus uses a book symbol; the zoom chevron is gone. In that slot, a layout control offers Single (today's Pages), Two-page (editable facing sheets with a hairline), and Grid (3 to 6 columns that fit, bird's-eye; a click returns to Single on that page). Canvas zoom and View-menu zoom remain. Continuous remains in View and overflow. Pagination does not change."
interpretation: Keep Pages vs Continuous as they are. Add a separate page arrangement — Single, Two-page, Grid — chosen from the toolbar slot that currently holds Zoom. Focus's rectangle becomes a book. Two-page is an editable facing spread with a hairline; the same lines stay on the same pages. Grid is a bird's-eye of the sheets, 3 to 6 columns as the window allows; it is not a writing surface, and a click returns to Single on that page. Choosing Two-page or Grid leaves Continuous. Zoom stays on the canvas and in the View menu.
keep:
