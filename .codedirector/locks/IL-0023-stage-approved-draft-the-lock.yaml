schemaVersion: 1
id: IL-0023
status: verified
utterance: "Stage 1 approved — draft the lock. Equivalence harness: over a script corpus, assert multi-container page starts are character-for-character identical to the engine's pagination, and that every character's on-screen rect matches the current architecture. Tests only, zero production change."
goal: A test harness proves, before any production code moves, that a multi-container TextKit layout driven by the engine's page starts breaks pages at exactly the characters ScreenplayExporter.paginate says, and places every character's rectangle where the current single-column architecture places it. This is the test that must never go red during the migration.
interpretation: |
  Stage 1 of the multi-container migration (docs/RFC-MULTI-CONTAINER-PAGES.md).
  It writes the proof BEFORE the thing it will judge, so the migration has a
  floor from its first commit rather than after it.

  One new test file. It builds the candidate architecture locally — one
  NSTextStorage, one NSLayoutManager, N containers each forced to stop at the
  engine's page-start character, exactly the arrangement the Stage 0 spike
  measured working — and compares it against the surface as it stands today.

  Two assertions, over a corpus of scripts short, long and awkward (a scene
  heading last on a page, a character cue that must not orphan, a very long
  dialogue run):

    1. PAGE STARTS. The character index beginning each container equals the
       engine's own page-start location, character for character. This is the
       assertion that stops the screen and the PDF diverging — the risk that
       nearly killed this design before the spike.
    2. GEOMETRY. For every character, the rect the multi-container layout
       gives, mapped to canvas coordinates, equals the rect today's
       architecture gives, within a small tolerance. One assertion covering
       the caret, the reveal highlight, the format bar and the find rects at
       once, rather than four features' worth of locks.

  A failure here is information, not an obstacle: if page starts diverge on a
  script in the corpus, that names the screenplay rule TextKit does not know,
  and the migration plan gains a requirement instead of a surprise.

  Nothing under Sources/ changes. Sources are denied so that is structural.
  The existing 568 tests are the floor and must stay green.
