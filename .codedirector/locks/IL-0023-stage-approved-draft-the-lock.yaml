  - packages/**
  - src/**
change: Add a multi-container equivalence harness under EDraftMacSurfaceTests — page-start equality against the engine, and per-character geometry equality against today's architecture. Tests only; no production file is touched.
verifyCommand: swift test --package-path apple/EDraftCore && swift test --package-path apple/EDraftMacSurface
verifyTimeoutMs: 900000
budget:
  files:
    - apple/EDraftMacSurface/Tests/EDraftMacSurfaceTests/MultiContainerEquivalenceTests.*
  symbols: []
  maxFiles: 1
  maxLines: 460
accept:
  - For every script in the corpus, each container's first character equals the engine's page-start location for that page, exactly.
  - For every character in the corpus, the multi-container rect and the current architecture's rect agree within tolerance.
  - Any divergence is reported naming the script, the page and the character — a harness that fails uninformatively is not a floor.
  - "The existing suites stay green: 251 macOS surface tests and 317 core tests, 0 failures."
  - No file under any Sources/ directory changes.
assumptions:
  - text: "Budget path written as a basename glob, not an exact path: lock_check errors on a budget file that does not exist yet, so a lock which CREATES a file cannot validate with its real name. The glob matches that one basename only. cdir gap, worth its own feature."
    source: system
    confirmed: false
  - text: Budget replaced by hand. The auto-draft anchored on toScreenplay, script, titlePageParagraphs, sanitiseXmlCharacters and titlePageLinesOf, and proposed six TypeScript files under packages/edraft for a Swift test. cdir indexes no Swift and cannot see this repository's subject; the flag IL-0001/IL-0002 added says exactly that, though the MCP server in this session still runs pre-IL-0001 code and does not show it.
    source: system
    confirmed: false
  - text: "The harness builds the candidate architecture inside the test file rather than in Sources. Stage 1 is a proof, not a foundation: production multi-container code belongs to Stage 2, and writing it here would make the proof depend on the thing it is meant to judge."
    source: system
    confirmed: false
  - text: Forced container breaks use the NSTextContainer.lineFragmentRect override measured working in the Stage 0 spike, together with layoutManager.textContainerChangedGeometry to invalidate. The spike's first run failed purely for want of that invalidation, and the failure was silent — stale layout, no error. Recorded so the harness does not rediscover it.
    source: system
    confirmed: false
  - text: Ceiling padded to 460 for a harness expected around 300 lines, per the human's instruction to stop drip-feeding small ceiling approvals. Two locks in cdir were already blocked by low estimates.
    source: user
    confirmed: true
