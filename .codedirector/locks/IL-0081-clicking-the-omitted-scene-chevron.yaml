id: IL-0081
status: verified
utterance: Clicking the omitted-scene chevron throws the writer to the end of the script — the caret lands at the document's end and the viewport follows it. Reproduce it in a test, find the mechanism, fix it. Toggling a cut scene open or shut must leave the caret and the viewport exactly where the writer left them, in both the single-container and the PageSheet layouts.
goal: "Toggling an omitted region — open or shut, by chevron or by VoiceOver — is caret- and viewport-neutral: after the toggle the selection is what it was and the scroll position is what it was, in both layout paths."
interpretation: |
  THE SYMPTOM, SEEN ON SCREEN. A click on the omitted card (spread mode,
  PageSheets live) landed the caret at the end of the script and the
  viewport followed it to the last page. Captured in a window screenshot:
  the document sits on its final sheet after the click.

  THE SUSPECT, READ IN THE CODE. `toggleOmission` re-lays the script —
  `render(editor.screenplay.elements) {}` — with an *empty* restoring
  closure. `render` preserves the selection only when
  `usesPageSheets` (sheetSelection), and other callers pass real
  restoringCaret closures; the toggle passes none. Somewhere between the
  storage replacement, the sheet reconciliation and `restoreViewport`'s
  caret correction, the caret ends up at the document's end and the page
  chases it. The exact link in that chain is what the failing test will
  name.

  THE METHOD. Write the regression test first — caret mid-document,
  toggle open, assert caret and scroll origin unchanged; toggle shut,
  same assertion — in the single container and on PageSheets. Watch it
  fail. Then fix the mechanism the failure names, and nothing more.

  OUT OF SCOPE. The card's look (IL-0080 shipped it; taste passes come
  from the human), the Navigator, print/PDF exclusion, and every other
  surface behaviour.
