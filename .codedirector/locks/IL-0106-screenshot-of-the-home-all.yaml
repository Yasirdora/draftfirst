id: IL-0106
status: verified
utterance: "[screenshot of the home's \"All topics\" section] since we have the table of content on top we do not need all topics, also I think we should rename table of contents to all topics, and please optimise it for  mobile currently the menu is not on the right side, Also if you remember I said it should be better than Apple's own design. make sure it is clean and production ready"
goal: The Help Center home loses its All topics section (the guide bar's index replaces it); the guide bar's "Table of Contents" is renamed "All topics"; on phones the All topics button sits at the right of the guide title and opens a compact index — the eight topics as icon rows opening their pages, with the current topic's articles listed under it — and the site header's menu button sits at the right edge. Clean, production-ready, and still fully usable without JavaScript.
interpretation: |
  1. HOME: the "All topics" section and its styles go. The guide bar's
  index lists every article on every help page, so the home keeps a full,
  JavaScript-free index; the topic icons already open each topic's page.

  2. RENAME: the guide bar's disclosure reads "All topics" (its summary and
  its nav's accessible name).

  3. THE INDEX, ON EVERY SIZE. Each chapter heading carries its topic's
  line icon (icons.ts) and still links to the topic's page. Desktop: the
  four-column index, every article listed. Phone (≤ 600 px): the "All
  topics" button sits at the right of the guide title, on the title's
  line, the search full width beneath; opened, the index is the eight
  topics as tappable icon rows (name, article count, chevron) — each opens
  its topic page — and, on an article, its own topic's articles listed
  under that row with the current one marked. Pure CSS (the current
  chapter carries a class); with JavaScript off every link is still there.

  4. SITE HEADER ON PHONES: the "Open eDraft" button and the ≡ menu sit at
  the right edge. Today the nav links hold them right; on phones the links
  are hidden and the buttons fall in beside the logo. One rule in the
  shared SiteLayout — every page on the site gets the fix; nothing else in
  the shared chrome changes.

  NOT CHANGED. Article and topic pages' content and layout, the search
  behaviour, articles.ts and every test file.
