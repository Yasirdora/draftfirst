accept:
  - A real mouse event on the right sheet followed by text insertion edits that sheet location and the bound model correctly.
  - Cross-page selection shares one range and resolves its endpoints into the appropriate sheet views.
  - Format bar remains in the visible viewport on page 2+, finder returns the correct content view and local rectangles, and reveal and ghost use actual sheet geometry.
  - Engine starts, complete coverage and character rectangle equivalence remain tested on both architectures, including the flag-off legacy path.
  - All three requested Swift package test suites and the exact requested macOS Debug build succeed in the real repository.
  - The report names any unmeasured cross-view drag gesture, tab order/first responder, editing churn, IME and feature-length performance; automated ranges alone do not prove gestures.
